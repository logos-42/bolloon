name: Release

# Tag 推送 (v*) 触发:
#   1. mac desktop (.dmg + .app.tar.gz)
#   2. win desktop (.exe via electron-builder, --dir 不打 installer 这里打 NSIS)
#   3. linux desktop (.AppImage)
#   4. iOS archive (.xcarchive + .ipa unsigned or signed if secrets 配置)
# Tag 例: git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'manual trigger reason'
        required: false
        default: 'manual'

permissions:
  contents: write   # 需要写 release
  pull-requests: write

jobs:
  # ============ macOS desktop ============
  desktop-mac:
    name: macOS Desktop
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all
      # 手搓 bundle 避开 electron-builder walker (1.1G @rayhanadev OOM)
      - run: npm run app:bundle
      - name: Package as DMG (optional, uses create-dmg)
        run: |
          if command -v create-dmg &>/dev/null; then
            create-dmg \
              --volname "Bolloon Agent" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "Bolloon Agent.app" 200 190 \
              --app-drop-link 600 185 \
              --no-internet-enable \
              "release/Bolloon Agent-${{ github.ref_name }}-mac.dmg" \
              "release/mac-arm64/Bolloon Agent.app" || echo "create-dmg failed, falling back to tarball"
          else
            echo "create-dmg not installed, skipping DMG"
          fi
      - name: Fallback tarball
        if: always()
        run: |
          cd "release/mac-arm64"
          tar -czf "../Bolloon Agent-${{ github.ref_name }}-mac.tar.gz" "Bolloon Agent.app"
      - uses: actions/upload-artifact@v4
        with:
          name: bolloon-desktop-mac
          path: |
            release/*.dmg
            release/*.tar.gz
          if-no-files-found: warn

  # ============ Windows desktop ============
  desktop-win:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all
      # windows 上 electron-builder walker 在 CI runner 上不一定 OOM (环境干净)
      - name: electron-builder Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bolloon-desktop-win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  # ============ Linux desktop ============
  desktop-linux:
    name: Linux Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all
      - name: electron-builder Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bolloon-desktop-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  # ============ iOS (Capacitor) ============
  ios-build:
    name: iOS Archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all
      - run: npx cap sync ios
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      # iOS 签名需要 Apple Developer 证书. 没配 secrets 就出 unsigned .ipa
      - name: Import signing certificate (optional)
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="bolloon-tmp"
          security create-keychain -p "$KEYCHAIN_PASSWORD" bolloon.keychain
          security default-keychain -s bolloon.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" bolloon.keychain
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k bolloon.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" bolloon.keychain
      - name: Install provisioning profile (optional)
        if: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/bolloon.mobileprovision
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/BolloonAgent.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Export IPA (unsigned, no provisioning)
        if: ${{ secrets.APPLE_CERT_P12_BASE64 == '' }}
        working-directory: ios
        run: |
          mkdir -p build/ExportOptions
          cat > build/ExportOptions/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          # 不打 installer (没签名); 上传 .xcarchive + 提醒 dev 本地签名
      - name: Package IPA
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
        working-directory: ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/BolloonAgent.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: bolloon-ios
          path: |
            ios/build/BolloonAgent.xcarchive
            ios/build/ipa/*.ipa
          if-no-files-found: warn

  # ============ GitHub Release ============
  release:
    name: GitHub Release
    needs: [desktop-mac, desktop-win, desktop-linux, ios-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
