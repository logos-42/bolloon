import java.util.Properties

plugins {
    id 'com.android.application'
    // 2026-08-12 (Phase 1): Kotlin — Android Agent Runtime (AccessibilityService + Agent Loop)
    id 'org.jetbrains.kotlin.android'
}

// ── Release 签名 (固定 keystore, 以后升级可覆盖安装) ──────────────
// 凭证在 android/keystore/keystore.properties (android/.gitignore 已忽略 *.jks + keystore.properties)
// 缺凭证时静默回退: release 产物为 unsigned, debug 构建不受影响。
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace 'com.hibs.bolloon'
    // compileSdk 36: capacitor-android 8.4.1 的 androidx 1.17 (activity/core/webkit) AAR metadata
    // 强制要求 compileSdk >= 36; targetSdk 仍 35 (platform-35 适配, 设备行为 = Android 15)。
    compileSdk 36

    defaultConfig {
        applicationId 'com.hibs.bolloon'
        minSdk 28
        targetSdk 35
        // versionCode/versionName 与 npm package.json 的版本对齐 (0.5.0) — 见 scripts/check-native-artifacts.mjs
        versionCode 500
        versionName '0.5.0'
    }

    // 2026-09-16: 渠道分化 —— 应用商店版必须摘掉「无障碍服务」与「Shizuku 提权通道」(商店审核红线),
    //   官网直装版保持功能完整。两者 applicationId 相同 (com.hibs.bolloon), 商店版清单覆盖在
    //   src/store/AndroidManifest.xml (用 tools:node="remove" 精确摘除, 不复制整份清单)。
    //   出包: ./gradlew :app:assembleFullRelease (官网) / :app:assembleStoreRelease (商店)
    flavorDimensions 'channel'
    productFlavors {
        full { dimension 'channel' }
        store { dimension 'channel' }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':capacitor-android')
    // 2026-08-12 (Phase 1): Kotlin stdlib — Android Agent Runtime
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
    // 2026-08-12 (Phase 2): Shizuku — 系统级 API (shell/pm/设备信息), 普通 App 借 adb/root 身份
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // capacitor-android 把 androidx 声明为 implementation (不透出), app 直接引用
    // AppCompatActivity (MainActivity 父类链) + androidx.annotation (RokidBridgePlugin), 需显式声明。
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    // Rokid CXR-M 手机端 SDK：官方 Maven 公开坐标 (maven.rokid.com)，真实通道 (非 mock)。
    implementation 'com.rokid.cxr:client-m:1.2.2'
}
