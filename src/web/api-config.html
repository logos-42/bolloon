<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 配置 - Bolloon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .api-config-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .provider-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .provider-card:hover {
      border-color: var(--accent);
    }

    .provider-card.active {
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    .provider-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .provider-name {
      font-size: 16px;
      font-weight: 600;
    }

    .provider-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--bg-primary);
    }

    .provider-badge.active {
      background: #22c55e;
    }

    .provider-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .provider-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.enabled {
      background: #22c55e;
    }

    .status-dot.disabled {
      background: #888;
    }

    /* 模态框 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      font-size: 20px;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group input[type="password"] {
      font-family: monospace;
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .btn-test {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      font-size: 12px;
    }

    .btn-test:hover {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .test-result {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .test-result.show {
      display: block;
    }

    .test-result.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .test-result.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .save-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #22c55e;
    }

    .save-indicator.show {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="api-config-page">
    <div class="page-header">
      <h1>API 配置</h1>
      <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        返回主页
      </a>
    </div>

    <div class="provider-grid" id="provider-grid">
      <!-- 动态填充 -->
    </div>
  </div>

  <!-- 配置模态框 -->
  <div class="modal-overlay" id="config-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">配置供应商</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>

      <form id="config-form">
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="api-key" placeholder="输入 API Key">
          <div class="form-hint">某些供应商需要 API Key 才能使用</div>
        </div>

        <div class="form-group">
          <label>Base URL</label>
          <input type="text" id="base-url" placeholder="https://api.example.com/v1">
          <div class="form-hint">留空使用默认地址</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>模型</label>
            <input type="text" id="model" placeholder="如 gpt-4">
          </div>
          <div class="form-group">
            <label>温度</label>
            <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7">
          </div>
        </div>

        <button type="button" class="btn btn-test" id="test-btn">测试连接</button>
        <div class="test-result" id="test-result"></div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">
            <span class="save-indicator" id="save-indicator">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              已保存
            </span>
            <span id="save-text">保存</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '';

    let currentProvider = null;
    let config = null;
    let providerInfo = null;

    // 加载配置
    async function loadConfig() {
      try {
        const resp = await fetch(`${API_BASE}/api/llm-config`);
        config = await resp.json();
        providerInfo = config.providerInfo;
        renderProviders();
      } catch (err) {
        console.error('Failed to load config:', err);
      }
    }

    // 渲染供应商列表
    function renderProviders() {
      const grid = document.getElementById('provider-grid');
      const providers = config.providers;

      grid.innerHTML = Object.entries(providers).map(([key, p]) => {
        const info = providerInfo[key];
        const isActive = config.activeProvider === key;
        return `
          <div class="provider-card ${isActive ? 'active' : ''}" data-provider="${key}">
            <div class="provider-card-header">
              <span class="provider-name">${info.name}</span>
              ${isActive ? '<span class="provider-badge active">使用中</span>' : ''}
            </div>
            <div class="provider-desc">${info.description}</div>
            <div class="provider-status">
              <span class="status-dot ${p.enabled ? 'enabled' : 'disabled'}"></span>
              <span>${p.enabled ? '已启用' : '未启用'}</span>
              ${p.enabled && p.apiKey ? ' · ' + p.apiKey : ''}
            </div>
          </div>
        `;
      }).join('');

      // 点击事件
      grid.querySelectorAll('.provider-card').forEach(card => {
        card.addEventListener('click', () => {
          const provider = card.dataset.provider;
          openConfigModal(provider);
        });
      });
    }

    // 打开配置模态框
    function openConfigModal(provider) {
      currentProvider = provider;
      const p = config.providers[provider];
      const info = providerInfo[provider];

      document.getElementById('modal-title').textContent = `配置 ${info.name}`;
      document.getElementById('api-key').value = p.apiKey?.replace(/\*\*\*/g, '') || '';
      document.getElementById('base-url').value = p.baseUrl || '';
      document.getElementById('model').value = p.model || '';
      document.getElementById('temperature').value = p.temperature || 0.7;
      document.getElementById('test-result').classList.remove('show', 'success', 'error');

      document.getElementById('config-modal').classList.add('show');
    }

    // 关闭模态框
    function closeModal() {
      document.getElementById('config-modal').classList.remove('show');
      currentProvider = null;
    }

    // 测试连接
    async function testConnection() {
      const apiKey = document.getElementById('api-key').value;
      const baseUrl = document.getElementById('base-url').value;
      const model = document.getElementById('model').value;
      const temperature = parseFloat(document.getElementById('temperature').value);

      const resultEl = document.getElementById('test-result');

      try {
        const resp = await fetch(`${API_BASE}/api/llm-test`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: currentProvider })
        });

        const result = await resp.json();

        resultEl.classList.add('show');
        if (result.success) {
          resultEl.classList.remove('error');
          resultEl.classList.add('success');
          resultEl.textContent = `连接成功！延迟: ${result.latency}ms`;
        } else {
          resultEl.classList.remove('success');
          resultEl.classList.add('error');
          resultEl.textContent = `连接失败: ${result.error}`;
        }
      } catch (err) {
        resultEl.classList.add('show', 'error');
        resultEl.textContent = `测试失败: ${err.message}`;
      }
    }

    // 保存配置
    async function saveConfig() {
      const apiKey = document.getElementById('api-key').value;
      const baseUrl = document.getElementById('base-url').value;
      const model = document.getElementById('model').value;
      const temperature = parseFloat(document.getElementById('temperature').value);

      const updateData = {
        enabled: true,
        apiKey,
        baseUrl: baseUrl || undefined,
        model: model || undefined,
        temperature
      };

      try {
        const resp = await fetch(`${API_BASE}/api/llm-config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: currentProvider,
            config: updateData
          })
        });

        if (resp.ok) {
          // 设置为活跃供应商
          await fetch(`${API_BASE}/api/llm-provider`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: currentProvider })
          });

          // 显示保存成功
          const indicator = document.getElementById('save-indicator');
          const saveText = document.getElementById('save-text');
          indicator.classList.add('show');
          saveText.textContent = '保存';

          setTimeout(() => {
            indicator.classList.remove('show');
            closeModal();
            loadConfig();
          }, 800);
        }
      } catch (err) {
        console.error('Failed to save config:', err);
      }
    }

    // 事件绑定
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('cancel-btn').addEventListener('click', closeModal);
    document.getElementById('test-btn').addEventListener('click', testConnection);
    document.getElementById('config-form').addEventListener('submit', (e) => {
      e.preventDefault();
      saveConfig();
    });

    // 点击遮罩关闭
    document.getElementById('config-modal').addEventListener('click', (e) => {
      if (e.target.id === 'config-modal') closeModal();
    });

    // 初始化
    loadConfig();
  </script>
</body>
</html>
