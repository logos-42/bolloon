<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 配置 - Bolloon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { setup } from 'https://esm.sh/@twind/core@1.1.3';

    setup({
      mode: 'inject',
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)',
            'bg-sidebar': 'var(--bg-sidebar)',
            'bg-hover': 'var(--bg-hover)',
            'bg-active': 'var(--bg-active)',
            text: 'var(--text)',
            'text-secondary': 'var(--text-secondary)',
            'text-muted': 'var(--text-muted)',
            accent: 'var(--accent)',
            border: 'var(--border)',
          },
        },
      },
    });

    import('/main.js');
  </script>
</body>
</html>
