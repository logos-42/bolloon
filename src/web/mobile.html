<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bolloon 手机端</title>
<script>
/* 启动页即时主题: 内部已选主题 > 系统主题 > 默认暗色. 在 CSS/JS 加载前先渲染, 避免白闪 */
(function () {
  var saved = null; try { saved = localStorage.getItem('bolloon_theme'); } catch (e) {}
  var sysLight = false; try { sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
  var light = saved ? saved === 'light' : sysLight;   // 内部优先级
  var root = document.documentElement;
  var t = light
    ? { '--bg': '#f5f5f0', '--bg-card': '#ffffff', '--bg-hover': '#eeeeea', '--text': '#1a1a18', '--text-secondary': '#606058', '--text-muted': '#909088', '--accent': '#8a9430', '--border': '#d0d0c8', 'bg': '#f5f5f0', 'fg': '#1a1a18' }
    : { '--bg': '#1a1a18', '--bg-card': '#222220', '--bg-hover': '#2a2a26', '--text': '#d8d8c8', '--text-secondary': '#909088', '--text-muted': '#606058', '--accent': '#c4d640', '--border': '#3a3a36', 'bg': '#1a1a18', 'fg': '#d8d8c8' };
  Object.keys(t).forEach(function (k) { if (k === 'bg') root.style.background = t[k]; else if (k === 'fg') root.style.color = t[k]; else root.style.setProperty(k, t[k]); });
})();
</script>
<link rel="stylesheet" href="./mobile.css">
</head>
<body>
<div id="app" class="app">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="topbar-title" id="topbar-title">首页</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-refresh" title="刷新">⟳</button>
      <button class="icon-btn" id="btn-add" title="添加会话">＋</button>
    </div>
  </header>

  <!-- 主页面: 双频滑动卡片 -->
  <main class="page-container" id="page-main" data-tab="main">
    <!-- 水平滑动卡片轨道 -->
    <div class="card-carousel" id="card-carousel">
      <div class="card-track" id="card-track">
        <!-- 卡片由 JS 动态加载 -->
      </div>
    </div>
    <!-- 卡片指示器 -->
    <div class="card-indicator" id="card-indicator"></div>
    <!-- 卡片详情浮层 (垂直展开) -->
    <div class="card-detail" id="card-detail" hidden>
      <div class="detail-header">
        <button class="icon-btn" id="detail-back">←</button>
        <h2 id="detail-name"></h2>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </main>

  <!-- 网络 tab -->
  <section class="page" id="page-network" data-tab="network" hidden>
    <div class="list">
      <div class="list-item" id="item-p2p"><span class="list-icon">🌐</span><span>P2P 好友</span></div>
      <div class="list-item" id="item-p2p-id"><span class="list-icon">🪪</span><span>我的 P2P ID</span></div>
    </div>
    <div class="section-label">P2P 好友列表</div>
    <div class="list" id="contacts-list"></div>
    <div class="section-label">MCP 工具 (触控调用)</div>
    <div class="list" id="mcp-tools"></div>
    <div class="section-label">待人工审批支付</div>
    <div class="list" id="approval-list"></div>
    <div class="section-label">A2UI 动态面板 (智能体生成)</div>
    <div id="a2ui-root"></div>
  </section>

  <!-- 我 tab -->
  <section class="page" id="page-me" data-tab="me" hidden>
    <div class="profile-card" id="profile-card">
      <div class="avatar" id="me-avatar">?</div>
      <div class="profile-info">
        <div class="profile-name" id="me-name">未登录</div>
        <div class="profile-did" id="me-did"></div>
      </div>
    </div>
    <div class="list">
      <div class="list-item" id="item-settings"><span class="list-icon">⚙️</span><span>设置</span><span class="list-arrow">›</span></div>
      <div class="list-item" id="item-wallet"><span class="list-icon">👛</span><span>钱包</span><span class="list-arrow">›</span></div>
      <div class="list-item" id="item-judgments"><span class="list-icon">🧠</span><span>判断力 API</span><span class="list-arrow">›</span></div>
      <div class="list-item" id="item-did"><span class="list-icon">🪪</span><span>DID 身份</span><span class="list-arrow">›</span></div>
      <div class="list-item" id="item-login"><span class="list-icon">🔐</span><span id="login-label">登录</span><span class="list-arrow">›</span></div>
      <div class="list-item" id="item-logout"><span class="list-icon">🚪</span><span>注销</span></div>
    </div>
  </section>
</main>

<!-- 底部 tab -->
<nav class="tabbar" id="tabbar">
  <button class="tab active" data-tab="main"><span class="tab-icon">⊞</span><span>首页</span></button>
  <button class="tab" data-tab="network"><span class="tab-icon">📡</span><span>网络</span></button>
  <button class="tab" data-tab="me"><span class="tab-icon">🙂</span><span>我</span></button>
</nav>

<!-- 首页: 创建新会话栏 (底部中央, tab 上方) -->
<button class="create-session-btn" id="btn-create-session" hidden>＋ 创建新会话</button>

<!-- 创建智能体: 底部滑入加载 sheet -->
<div class="sheet" id="create-sheet" hidden>
  <div class="sheet-inner">
    <div class="spinner"></div>
    <div class="sheet-text">正在创建智能体...</div>
  </div>
</div>

<!-- 添加好友: 底部滑出选择 sheet -->
<div class="sheet" id="addfriend-sheet" hidden>
  <div class="sheet-inner sheet-inner-choices">
    <div class="sheet-title">添加 P2P 好友</div>
    <button class="sheet-choice" id="choice-scan">📷 扫码添加</button>
    <button class="sheet-choice" id="choice-manual">🔗 手动输入地址</button>
    <button class="sheet-choice sheet-cancel" id="choice-cancel">取消</button>
  </div>
</div>
</div>

<!-- 2026-08-14: 手机端内化内核 (IndexedDB 数据 + 本地身份 + 支付审批 + Agent). 必须最先加载 -->
<script src="./mobile-core.js"></script>
<script src="./mobile.js"></script>
<!-- 2026-08-12: A2UI 渲染器 (智能体生成动态 UI, 挂载 #a2ui-root) -->
<script src="./a2ui-client.js"></script>
</body>
</html>
