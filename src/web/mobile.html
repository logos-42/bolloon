<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bolloon 手机端</title>
<script>
(function () {
  var saved = null; try { saved = localStorage.getItem('bolloon_theme'); } catch (e) {}
  var sysLight = false; try { sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
  var light = saved === 'light' ? true : (saved === 'dark' ? false : sysLight);
  var root = document.documentElement;
  var t = light
    ? { '--bg': '#f5f5f0', '--bg-card': '#ffffff', '--bg-hover': '#eeeeea', '--text': '#1a1a18', '--text-secondary': '#606058', '--text-muted': '#909088', '--accent': '#8a9430', '--border': '#d0d0c8' }
    : { '--bg': '#1a1a18', '--bg-card': '#222220', '--bg-hover': '#2a2a26', '--text': '#d8d8c8', '--text-secondary': '#909088', '--text-muted': '#606058', '--accent': '#c4d640', '--border': '#3a3a36' };
  Object.keys(t).forEach(function (k) { root.style.setProperty(k, t[k]); });
  root.setAttribute('data-theme', light ? 'light' : 'dark');
  root.style.colorScheme = light ? 'light' : 'dark';
})();
</script>
<link rel="stylesheet" href="./mobile.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1a18">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolloon">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<div id="app" class="app">
  <!-- 顶部标题栏 -->
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" title="菜单"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
    <div class="topbar-title" id="topbar-title">首页</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <!-- 页面容器：四个 tab 通过 hidden 切换 -->
  <div class="pages" id="pages">

    <!-- ===== 首页：智能体卡片 + 世界机会流 ===== -->
    <section class="page" id="page-home" data-tab="home" hidden>
      <div class="world-feed">
        <div class="world-feed-header">
          <span>✦ 世界送来</span>
          <span class="world-feed-sub">自动匹配 · 持续校准</span>
        </div>
        <div class="world-feed-cards" id="world-feed-cards">
          <div class="world-feed-loading">世界正在观察…</div>
        </div>
      </div>

      <div class="card-track" id="card-track">
        <div class="card-loading">加载智能体卡片…</div>
      </div>
      <div class="card-indicator" id="card-indicator"></div>

      <div class="world-input-bar">
        <input type="text" id="world-input" placeholder="告诉世界你在做什么 / 需要什么… (Enter 自动匹配)" autocomplete="off" />
        <button class="world-input-send" id="world-input-send">→ 世界</button>
      </div>
    </section>

    <!-- ===== 通讯录：联系人 + P2P 状态 ===== -->
    <section class="page" id="page-friends" data-tab="friends" hidden>
      <div class="list">
        <div class="list-item" id="item-add-friend"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6S13.7 16 14.5 19"/><path d="M17 8v6M14 11h6"/></svg></span><span>新的朋友</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-p2p"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.3 3.5 5.3 3.5 8.5s-1.2 6.2-3.5 8.5c-2.3-2.3-3.5-5.3-3.5-8.5S9.7 5.8 12 3.5z"/></svg></span><span>群聊</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-scan-net"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg></span><span>扫码入网 / 加好友</span></div>
        <div class="list-item" id="item-nearby"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1.4"/><path d="M12 13.6V19"/></svg></span><span>附近设备</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-p2p-id"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.6 15.8a3.2 3.2 0 0 1 5.8 0M13.5 10h5M13.5 13.5h5"/></svg></span><span>我的连接标识</span></div>
      </div>
      <input type="file" id="qr-scan-input" accept="image/*" capture="environment" style="display:none">
      <div class="section-label">网络连接</div>
      <div class="list" id="p2p-status"></div>
      <div class="section-label">联系人列表</div>
      <div class="contacts-wrap" id="contacts-wrap">
        <div class="list" id="contacts-list"></div>
        <div class="contacts-index" id="contacts-index"></div>
      </div>
    </section>

    <!-- ===== 任务：派活 + 对话 ===== -->
    <section class="page task-chat-page" id="page-tasks" data-tab="tasks" hidden>
      <div class="task-dash">
        <button class="task-dash-btn" id="task-dash-network" title="网络工具"><span class="task-dash-ico">🌐</span><span>网络</span></button>
        <button class="task-dash-btn" id="task-dash-sign" title="签名状态"><span class="task-dash-ico">🔏</span><span id="tasks-signing">签名…</span></button>
        <button class="task-dash-btn" id="tasks-refresh" title="刷新"><span class="task-dash-ico">⟳</span><span>刷新</span></button>
      </div>
      <div class="task-chat" id="task-chat">
        <div class="task-chat-empty" id="task-chat-empty">给 Bolloon 派个活… 例：查一下我的身份 / 汇总钱包状态</div>
      </div>
      <div class="task-input-bar">
        <input type="text" id="task-input" placeholder="给 Bolloon 派个活… (Enter 发送)" autocomplete="off" />
        <button id="task-input-send">→ 派活</button>
      </div>
      <div class="task-network-panel" id="task-network-panel" hidden>
        <div class="task-network-head">
          <button id="task-network-back">←</button>
          <span style="flex:1;font-weight:600">网络工具</span>
        </div>
        <div class="task-network-body">
          <div class="list" id="net-members"></div>
          <div class="list" id="agent-services"></div>
          <div class="list" id="agent-control"></div>
          <div class="list" id="approval-list"></div>
          <div id="a2ui-root"></div>
        </div>
      </div>
    </section>

    <!-- ===== 我：身份 / 钱包 / 设置 ===== -->
    <section class="page" id="page-me" data-tab="me" hidden>
      <div class="profile-card" id="profile-card">
        <div class="avatar" id="me-avatar" title="点击修改头像">?</div>
        <div class="profile-info" id="profile-info">
          <div class="profile-name" id="me-name">未登录</div>
          <div class="profile-did" id="me-did"></div>
          <div class="profile-p2p" id="me-p2p"></div>
        </div>
        <span class="profile-chevron">›</span>
      </div>
      <input type="file" id="avatar-input" accept="image/*" hidden>
      <div class="list">
        <div class="list-item" id="item-settings"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7.5h6M14 7.5h6M4 16.5h9M17 16.5h3"/><circle cx="12" cy="7.5" r="2.2"/><circle cx="15" cy="16.5" r="2.2"/></svg></span><span>设置</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-wallet"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="12" rx="3"/><path d="M3 10.5h18"/><circle cx="16.8" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></svg></span><span>钱包</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-judgments"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M11 3.5l1.8 4.7 4.7 1.8-4.7 1.8L11 16.5l-1.8-4.7L4.5 10l4.7-1.8z"/><path d="M18.5 16l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg></span><span>判断力 API</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-contacts"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M3.5 9h17"/><circle cx="8.5" cy="14" r="1.6"/><path d="M12 13h5M12 15.5h3"/></svg></span><span>联系方式与授权</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-login"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span><span id="login-label">登录</span><span class="list-arrow">›</span></div>
        <div class="list-item" id="item-logout"><span class="list-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4.5h3.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3.5"/><path d="M10 8.5l-3.5 3.5L10 15.5M6.5 12h8"/></svg></span><span>注销</span></div>
      </div>
    </section>

  </div>

  <!-- 底部 tab -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home"><span class="tab-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span><span>首页</span></button>
    <button class="tab" data-tab="friends"><span class="tab-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6S13.7 16 14.5 19"/><path d="M17 8v6M14 11h6"/></svg></span><span>通讯录</span></button>
    <button class="tab" data-tab="tasks"><span class="tab-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7.5h10M4 12h7M4 16.5h12"/><path d="M18 5.5l1.6 1.6L22 4.5"/><path d="M18 14.5l1.6 1.6L22 13.5"/></svg></span><span>任务</span></button>
    <button class="tab" data-tab="me"><span class="tab-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></span><span>我</span></button>
  </nav>

  <!-- 隐私同意门 -->
  <div class="sheet" id="privacy-gate" hidden>
    <div class="sheet-inner">
      <div class="sheet-title">隐私政策与权限说明</div>
      <div class="sheet-text" id="privacy-gate-body"></div>
      <a class="privacy-link" href="#" id="privacy-gate-link">阅读完整隐私政策 ›</a>
      <button class="sheet-choice" id="privacy-agree">同意并继续</button>
      <button class="sheet-choice sheet-cancel" id="privacy-decline">不同意</button>
    </div>
  </div>

  <!-- 创建智能体 sheet -->
  <div class="sheet" id="create-sheet" hidden>
    <div class="sheet-inner">
      <div class="spinner"></div>
      <div class="sheet-text">正在创建智能体...</div>
    </div>
  </div>

  <!-- 加载中 toast -->
  <div class="sheet" id="toast-sheet" hidden style="align-items:flex-end;justify-content:center;">
    <div class="sheet-inner" style="max-width:260px;align-items:center;text-align:center;">
      <div class="sheet-text" id="toast-text"></div>
    </div>
  </div>

  <!-- 脚本：Tauri 内嵌 axum 服务，前端通过标准 fetch /api/* 请求（同源 HTTP） -->
  <script src="./mobile-core.js"></script>
  <script src="./mobile.js"></script>
  <script>
    /* Service Worker：iPhone "添加到主屏幕" 独立运行 */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
