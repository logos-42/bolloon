<!DOCTYPE html>
<html>
<head>
  <title>Test API</title>
</head>
<body>
  <h1>Test LLM Config API</h1>
  <div id="result">Loading...</div>
  <script>
    fetch('/api/llm-config')
      .then(r => r.json())
      .then(data => {
        document.getElementById('result').innerHTML = `
          <pre>Active: ${data.activeProvider}</pre>
          <pre>Providers: ${Object.keys(data.providers).join(', ')}</pre>
        `;
      })
      .catch(err => {
        document.getElementById('result').innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
      });
  </script>
</body>
</html>
