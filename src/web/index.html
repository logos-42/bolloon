<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolloon Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="sidebar-toggle" class="sidebar-toggle" title="收起侧边栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="sidebar-brand">
          <span class="brand-icon">◈</span>
          <span class="brand-text">Bolloon</span>
        </span>
        <button id="load-session-btn" class="sidebar-action" title="加载Session">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>
      <input type="file" id="session-file-input" accept=".json" style="display:none">

      <div class="sidebar-section">
        <div class="section-header">
          <span class="section-title">频道</span>
        </div>
        <button id="new-channel-btn" class="section-action" title="新建频道">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>新建</span>
        </button>
        <ul class="channel-list" id="channel-list"></ul>
      </div>

      <div class="sidebar-footer">
        <div class="agent-status">
          <span class="status-dot"></span>
          <span class="status-text">已连接</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <span class="channel-indicator" id="channel-indicator"></span>
          <h1 id="channel-name">Bolloon Agent</h1>
        </div>
        <div class="header-right">
          <button id="theme-toggle" class="theme-toggle" title="切换主题">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="api-config-btn" class="header-action" title="API 配置">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="p2p-network-btn" class="header-action" title="P2P 网络">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="5" r="3"></circle>
              <circle cx="5" cy="19" r="3"></circle>
              <circle cx="19" cy="19" r="3"></circle>
              <line x1="12" y1="8" x2="5" y2="16"></line>
              <line x1="12" y1="8" x2="19" y2="16"></line>
            </svg>
          </button>
          <button id="task-queue-btn" class="header-action" title="任务队列">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path>
              <rect x="9" y="3" width="6" height="4" rx="1"></rect>
              <line x1="9" y1="12" x2="15" y2="12"></line>
              <line x1="9" y1="16" x2="13" y2="16"></line>
            </svg>
            <span id="task-badge" class="task-badge" style="display:none;">0</span>
          </button>
        </div>
      </header>

      <!-- P2P Network Modal -->
      <div id="p2p-modal" class="modal">
        <div class="modal-content modal-p2p-wide">
          <div class="modal-header">
            <h2>P2P 网络</h2>
            <button id="p2p-modal-close" class="modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <!-- 标签页切换 -->
            <div class="p2p-tabs">
              <button class="p2p-tab active" data-tab="identity">我的身份</button>
              <button class="p2p-tab" data-tab="connect">连接</button>
              <button class="p2p-tab" data-tab="history">历史记录</button>
              <button class="p2p-tab" data-tab="messages">消息 <span id="p2p-unread-badge" class="unread-badge" style="display:none">0</span></button>
            </div>

            <!-- 我的身份标签页 -->
            <div class="p2p-tab-content active" id="p2p-tab-identity">
              <div class="p2p-identity-card">
                <div class="identity-status">
                  <span class="status-indicator" id="p2p-status-indicator"></span>
                  <span id="p2p-status-text">未初始化</span>
                </div>
                <div class="identity-info">
                  <div class="info-row">
                    <span class="info-label">DID:</span>
                    <code id="p2p-did" class="info-value mono">-</code>
                    <button class="copy-btn" onclick="copyToClipboard('p2p-did')" title="复制">📋</button>
                  </div>
                  <div class="info-row">
                    <span class="info-label">CID:</span>
                    <code id="p2p-cid" class="info-value mono">-</code>
                    <button class="copy-btn" onclick="copyToClipboard('p2p-cid')" title="复制">📋</button>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Node ID:</span>
                    <code id="p2p-node-id" class="info-value mono">-</code>
                    <button class="copy-btn" onclick="copyToClipboard('p2p-node-id')" title="复制">📋</button>
                  </div>
                </div>
                <button id="p2p-init-btn" class="btn-primary">初始化 P2P</button>
              </div>

              <!-- 分享面板 -->
              <div class="p2p-share-panel" id="p2p-share-panel" style="display:none">
                <h4>分享给好友</h4>
                <div class="share-actions">
                  <button id="p2p-copy-link" class="btn-secondary">📋 复制链接</button>
                  <button id="p2p-show-qr" class="btn-secondary">📱 二维码</button>
                  <button id="p2p-export-file" class="btn-secondary">📁 导出文件</button>
                </div>
                <div id="p2p-share-link" class="share-link-box" style="display:none">
                  <input type="text" id="p2p-invite-link" readonly>
                  <button class="copy-btn" onclick="copyToClipboard('p2p-invite-link')">📋</button>
                </div>
              </div>

              <!-- QR码弹窗 -->
              <div id="p2p-qr-modal" class="modal" style="display:none">
                <div class="modal-content modal-sm">
                  <div class="modal-header">
                    <h3>扫描连接</h3>
                    <button class="modal-close" onclick="document.getElementById('p2p-qr-modal').style.display='none'">&times;</button>
                  </div>
                  <div class="modal-body" style="text-align:center">
                    <canvas id="p2p-qr-canvas"></canvas>
                    <p class="qr-hint">让对方扫描此二维码</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- 连接标签页 -->
            <div class="p2p-tab-content" id="p2p-tab-connect" style="display:none">
              <div class="p2p-connect-section">
                <h4>连接到其他节点</h4>
                <div class="p2p-connect-form">
                  <input type="text" id="p2p-connect-input" placeholder="粘贴 CID、链接或扫描二维码...">
                  <button id="p2p-connect-btn" class="btn-primary">连接 ▶</button>
                </div>
                <div id="p2p-connect-progress" class="connect-progress" style="display:none">
                  <div class="progress-bar">
                    <div class="progress-fill" id="p2p-progress-fill"></div>
                  </div>
                  <span id="p2p-progress-text" class="progress-text">验证输入格式...</span>
                </div>
                <div id="p2p-connect-result" class="connect-result"></div>
              </div>

              <!-- 快速连接：历史记录 -->
              <div class="p2p-quick-connect">
                <h4>快速连接</h4>
                <div id="p2p-quick-list" class="quick-list">
                  <div class="quick-empty">暂无历史记录</div>
                </div>
              </div>
            </div>

            <!-- 历史记录标签页 -->
            <div class="p2p-tab-content" id="p2p-tab-history" style="display:none">
              <div class="p2p-history-toolbar">
                <button id="p2p-history-refresh" class="btn-secondary btn-sm">🔄 刷新</button>
              </div>
              <div id="p2p-history-list" class="history-list">
                <div class="history-empty">暂无连接历史</div>
              </div>
            </div>

            <!-- 消息标签页 -->
            <div class="p2p-tab-content" id="p2p-tab-messages" style="display:none">
              <div class="p2p-messages-toolbar">
                <button id="p2p-mark-all-read" class="btn-secondary btn-sm">全部标记已读</button>
              </div>
              <div id="p2p-messages-list" class="messages-list">
                <div class="messages-empty">暂无消息</div>
              </div>

              <!-- 离线队列 -->
              <div id="p2p-offline-queue" class="offline-queue" style="display:none">
                <h4>📤 离线消息 (<span id="p2p-queue-count">0</span>)</h4>
                <div id="p2p-queue-list" class="queue-list"></div>
              </div>
            </div>

            <!-- 已连接节点（所有标签页共享底部） -->
            <div class="p2p-peers-section">
              <h4>已连接节点 (<span id="p2p-peer-count">0</span>)</h4>
              <div id="p2p-peers-list" class="peers-list">
                <div class="peer-empty">暂无连接</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Task Queue Modal -->
      <div id="task-modal" class="modal">
        <div class="modal-content modal-wide">
          <div class="modal-header">
            <h2>任务队列</h2>
            <button id="task-modal-close" class="modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="task-toolbar">
              <button id="task-add-btn" class="btn-primary btn-sm">+ 新建任务</button>
              <button id="task-execute-next-btn" class="btn-secondary btn-sm">▶ 执行下一个</button>
            </div>
            <div id="task-list" class="task-list">
              <div class="task-empty">暂无任务，点击上方按钮创建</div>
            </div>
          </div>
        </div>
      </div>


      <!-- Create Task Modal -->
      <div id="create-task-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>新建任务</h2>
            <button id="create-task-modal-close" class="modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>任务类型</label>
              <select id="task-type">
                <option value="chat">对话</option>
                <option value="read">读取文档</option>
                <option value="summarize">总结文档</option>
                <option value="workflow">工作流</option>
              </select>
            </div>
            <div class="form-group">
              <label>任务标题</label>
              <input type="text" id="task-title" placeholder="输入任务标题">
            </div>
            <div class="form-group">
              <label>任务描述</label>
              <textarea id="task-desc" placeholder="输入任务描述或内容" rows="3"></textarea>
            </div>
            <div class="form-group workflow-steps" style="display:none;">
              <label>工作流步骤（每行一个）</label>
              <textarea id="task-steps" placeholder="步骤1&#10;步骤2&#10;步骤3" rows="4"></textarea>
            </div>
            <div class="btn-group">
              <button id="task-cancel-btn" class="btn-secondary">取消</button>
              <button id="task-create-btn" class="btn-primary">创建并执行</button>
            </div>
          </div>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="message message-ai">
          <div class="bubble bubble-ai">
            <span class="loading-dots">加载中<span>.</span><span>.</span><span>.</span></span>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
          <button id="send" class="send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="/p2p-store.js"></script>
  <script src="/p2p-client.js"></script>
  <script src="/client.js"></script>
</body>
</html>
