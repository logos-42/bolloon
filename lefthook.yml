# lefthook.yml — Bolloon 源码护栏 (阶段 C 护栏 1)
#
# 用户授权装(2026-06-14 决定阶段 C 护栏全套)
# 触发: git commit / git push
# 目的: LLM 自动改的代码在进库前先过 vitest + tsc,坏就拦
#
# 2026-06-17: agent auto-evolve (Q3-B 决策)
#   - push agent/* 分支: vitest-full / build-check / tag-baseline 全部跳过 (CI 兜底)
#   - push master/main: 仍跑全测 + tag 守护
#   - 跳过条件: BOLLOON_AUTO_EVOLVE=1 环境变量 OR commit message 以 "auto-evolve:" 开头

pre-commit:
  parallel: true
  commands:
    vitest-bail:
      glob: "src/**/*.{ts,tsx,js}"
      run: sh -c 'if [ "$BOLLOON_AUTO_EVOLVE" = "1" ] || git log -1 --pretty=%B 2>/dev/null | head -1 | grep -q "^auto-evolve:"; then echo "[skip] vitest-bail (auto-evolve)"; exit 0; fi; npx vitest run --bail=1 --reporter=dot'
    tsc-check:
      glob: "src/**/*.{ts,tsx}"
      run: sh -c 'if [ "$BOLLOON_AUTO_EVOLVE" = "1" ] || git log -1 --pretty=%B 2>/dev/null | head -1 | grep -q "^auto-evolve:"; then echo "[skip] tsc-check (auto-evolve)"; exit 0; fi; npx tsc --noEmit'
    # system-prompt 字符上限 + 版本标记 + hibsml 脱除 (layer 改动时触发)
    validate-prompt-layers:
      glob: "src/llm/system-prompt/layers/**/*.md"
      run: npx tsx -r dotenv/config scripts/validate-system-prompt.ts

pre-push:
  parallel: true
  commands:
    vitest-full:
      run: sh -c 'branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo none); if [ "$branch" = "master" ] || [ "$branch" = "main" ]; then npx vitest run --reporter=dot; else echo "[skip] vitest-full (not master/main, branch=$branch)"; exit 0; fi'
    build-check:
      run: sh -c 'branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo none); if [ "$branch" = "master" ] || [ "$branch" = "main" ]; then npm run build:main; else echo "[skip] build-check (not master/main, branch=$branch)"; exit 0; fi'
    tag-baseline:
      run: sh -c 'branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo none); if [ "$branch" = "master" ] || [ "$branch" = "main" ]; then if git tag -l "auto-evolve-baseline-*" | grep -q .; then exit 0; else echo "[ERROR] push to master/main requires auto-evolve-baseline-* tag. Run: bash scripts/auto-evolve-snapshot.sh"; exit 1; fi; else echo "[skip] tag-baseline (not master/main, branch=$branch)"; exit 0; fi'
