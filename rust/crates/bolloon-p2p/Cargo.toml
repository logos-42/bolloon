[package]
name = "bolloon-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bolloon P2P — 去中心化协作 (DID 身份 · 群聊 store · 传输抽象)"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
bs58.workspace = true
hex.workspace = true
rand = "0.8"
chrono.workspace = true
futures.workspace = true
bolloon-kernel = { path = "../bolloon-kernel" }

# 可选 DIAP 后端：通过 feature 注入, 不在 workspace 成员里直接 path 依赖
# （DIAP 的 cid 0.10 → yanked core2 会拖垮整个 workspace 解析; 单独仓库维护）
[features]
default = []
# 未来接 DIAP 时: 在 Cargo.toml 加
#   diap-rs-sdk = { path = "../DIAP_Rust_SDK", optional = true }
#   diap-backend = ["dep:diap-rs-sdk"]
