[package]
name = "bolloon-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bolloon Agent — KernelLoop + 多智能体群聊 (ReAct 循环 · 工具调用 · 群聊参与)"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true
bolloon-kernel = { path = "../bolloon-kernel" }
bolloon-harness = { path = "../bolloon-harness" }
bolloon-llm = { path = "../bolloon-llm" }
bolloon-p2p = { path = "../bolloon-p2p" }
bolloon-config = { path = "../bolloon-config" }
bolloon-econ = { path = "../bolloon-econ" }
bs58.workspace = true
hex.workspace = true
sha2.workspace = true
hmac = "0.12"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
# 邮件真协议 (2026-11-13): IMAP 收信 + SMTP 发信
# 2026-11-17: IMAP 依赖 native-tls → OpenSSL, Android 交叉编译没有 OpenSSL 头/库。
#   手机端不用 IMAP 收信 ⇒ 只在非 Android 平台编译该适配器 (见 adapters/mod.rs 与 config.rs 的 cfg)。
base64.workspace = true
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
urlencoding = "2"
ureq = { version = "2", features = ["json"] }
# 记忆外挂 (crates.io 0.1.0, logos-42/hindsight-rust): 进程内 retain/recall/reflect
hindsight-engine = "0.1"

# IMAP 收信只在桌面/服务器端编译 (native-tls → OpenSSL, Android 无)
[target.'cfg(not(target_os = "android"))'.dependencies]
imap = "2"
native-tls = "0.2"
