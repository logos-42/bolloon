[package]
name = "bolloon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bolloon CLI — 命令入口 (bolloon 命令面)"

[[bin]]
name = "bolloon"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
tracing-subscriber.workspace = true
bolloon-llm = { path = "../bolloon-llm" }
bolloon-web = { path = "../bolloon-web" }
bolloon-kernel = { path = "../bolloon-kernel" }
bolloon-agent = { path = "../bolloon-agent" }
bolloon-harness = { path = "../bolloon-harness" }
bolloon-p2p = { path = "../bolloon-p2p" }
chrono.workspace = true
ureq = { version = "2", features = ["json"] }
hex.workspace = true
libc.workspace = true
bolloon-tui = { path = "../bolloon-tui" }
base64 = { workspace = true }

# QUIC 端对端直连传输 (默认启用): 好友对话的直连底座, 不经 HTTP 中继。
# 关掉即退回纯 HTTP 跨机, 不影响其它功能。
[features]
default = ["quic-transport"]
quic-transport = ["bolloon-p2p/quic-transport"]

