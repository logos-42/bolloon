[package]
name = "bolloon-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bolloon Web — Web UI (hushforge 布局) + HTTP API"

[dependencies]
bs58 = "0.5"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
axum.workspace = true
tower-http.workspace = true
anyhow.workspace = true
bolloon-llm = { path = "../bolloon-llm" }
bolloon-agent = { path = "../bolloon-agent" }
bolloon-p2p = { path = "../bolloon-p2p" }
bolloon-x402 = { path = "../bolloon-x402" }
bolloon-kernel = { path = "../bolloon-kernel" }
bolloon-config = { path = "../bolloon-config" }
bolloon-econ = { path = "../bolloon-econ" }
ureq = { version = "2", features = ["json"] }
sha2.workspace = true
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
futures.workspace = true
chrono.workspace = true
hex.workspace = true
hashavatar.workspace = true
base64.workspace = true
qrcode = { version = "0.14.1", features = ["svg"] }
# DIAP 跨 NAT 隧道 (可选): 让 web 的跨机链路走 iroh, 不再要求对端 HTTP 可达
diap-rs-sdk = { version = "0.3.7", optional = true }
# 与 quinn 同一个 TLS 后端; DIAP 的 iroh 会同时拉 aws-lc-rs, 必须显式装 ring
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# QUIC 端对端直连传输 (默认启用): 好友对话的直连底座, 不经 HTTP 中继。
# 关掉即退回纯 HTTP 跨机 (directory_peers 那套), 不影响其它功能。
[features]
default = ["quic-transport"]
quic-transport = ["bolloon-p2p/quic-transport"]
# 跨 NAT: peer_json 自动优先走 DIAP 隧道 (未启用时行为不变)
diap-backend = ["bolloon-p2p/diap-backend", "dep:diap-rs-sdk"]
