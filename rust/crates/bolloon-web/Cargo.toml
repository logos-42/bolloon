[package]
name = "bolloon-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bolloon Web — Web UI (hushforge 布局) + HTTP API"

[dependencies]
bs58 = "0.5"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
axum.workspace = true
tower-http.workspace = true
anyhow.workspace = true
bolloon-llm = { path = "../bolloon-llm" }
bolloon-agent = { path = "../bolloon-agent" }
bolloon-p2p = { path = "../bolloon-p2p" }
bolloon-x402 = { path = "../bolloon-x402" }
bolloon-kernel = { path = "../bolloon-kernel" }
bolloon-config = { path = "../bolloon-config" }
bolloon-econ = { path = "../bolloon-econ" }
ureq = { version = "2", features = ["json"] }
sha2.workspace = true
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
futures.workspace = true
chrono.workspace = true
hex.workspace = true
hashavatar.workspace = true
base64.workspace = true
qrcode = { version = "0.14.1", features = ["svg"] }

# QUIC 端对端直连传输 (默认启用): 好友对话的直连底座, 不经 HTTP 中继。
# 关掉即退回纯 HTTP 跨机 (directory_peers 那套), 不影响其它功能。
[features]
default = ["quic-transport"]
quic-transport = ["bolloon-p2p/quic-transport"]
