<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bolloon Agent</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#000; --panel:#08090b; --panel2:#111418; --line:#252b34;
    --text:#f2f6fa; --muted:#9aa6b2; --accent:#c4d640; --glow:#ffd166;
    --btn-bg:#151a20; --btn-text:#f2f6fa; --btn-border:#2a323d;
    --user-bg:#1e3a2f; --user-text:#eaf3ff; --active:#1a2430;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme:light;
      --bg:#f5f7fa; --panel:#fff; --panel2:#f0f3f7; --line:#dfe5ec;
      --text:#11151a; --muted:#68727d; --accent:#5a7d0a; --glow:#b77900;
      --btn-bg:#fff; --btn-text:#11151a; --btn-border:#d8e0ea;
      --user-bg:#e2f0d8; --user-text:#0b1220; --active:#e8f0ff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:284px 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .18s ease}
  #app.collapsed{grid-template-columns:66px 1fr}
  #app.room-open{grid-template-columns:284px minmax(0,1fr) var(--roomw,360px)}
  #app.collapsed.room-open{grid-template-columns:66px minmax(0,1fr) var(--roomw,360px)}
  .room-panel{display:none;position:relative;background:var(--panel);border-left:1px solid var(--line);flex-direction:column;min-width:0;overflow:hidden}
  #app.room-open .room-panel{display:flex}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;padding:14px 12px 10px;font-weight:600;white-space:nowrap}
  #collapseBtn{display:grid;place-items:center;width:32px;height:28px;padding:0;border-radius:8px;margin-left:auto;flex:none}
  #app.collapsed .brand{justify-content:center;padding:14px 0 10px}
  #app.collapsed #collapseBtn{display:none}
  #app.collapsed .sec,#app.collapsed .item .txt{display:none}
  .brand-icon{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
  .side-actions{display:flex;gap:8px;padding:0 12px 10px;align-items:center}
  .icon-btn{display:grid;place-items:center;width:38px;height:34px;padding:0}
  .side-scroll{flex:1;overflow:auto;padding:0 8px 8px}
  .sec{margin:8px 6px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--active);border:1px solid var(--line)}
  .item .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px;overflow:hidden;flex:none}
  .item .txt{min-width:0;flex:1}
  .item .txt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .txt small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .account{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .account:hover{background:var(--panel2)}
  .account .ava{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
  .account .who{min-width:0;flex:1}
  .account .who b{display:block;font-weight:600}
  .account .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  header{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted)}
  header b{color:var(--text)}
  .grow{flex:1}
  #chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:30px clamp(40px,10vw,180px);display:flex;flex-direction:column;gap:14px}
  .empty{height:100%;display:grid;place-items:center;color:var(--muted)}
  .empty h1{font-size:28px;font-weight:600;color:var(--text);margin:0}
  .msg-row{display:flex;flex-direction:column;max-width:min(760px,78%);min-width:0}
  .msg-row.user{align-self:flex-end;align-items:flex-end}
  .msg-row.bot{align-self:flex-start;margin-left:36px;align-items:flex-start}
  .msg{max-width:100%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.55;white-space:normal}
  .msg.user{background:var(--user-bg);color:var(--user-text);padding:8px 14px;border-radius:11px}
  .msg.bot{background:var(--panel2);border:1px solid var(--line);position:relative}
  .msg.bot::before{content:"";position:absolute;left:-36px;top:2px;width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
  .msg.bot p{margin:0 0 8px}
  .msg.bot p:last-child{margin-bottom:0}
  .msg.bot pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;overflow:auto}
  .msg.bot code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:12px}
  .msg.bot pre code{background:none;border:none;padding:0}
  .composer{border-top:1px solid var(--line);padding:12px 16px 6px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;height:46px;max-height:140px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
  .composer #send{min-width:58px;display:grid;place-items:center;padding:7px 10px}
  button{font:inherit;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:10px;padding:7px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#3a4a1a,#2a3610);color:#fff;border-color:#3a4a1a;font-weight:600}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%{box-shadow:0 0 0 10px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
  .chat-new{display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:9px;flex:none}
  .composer-footer{display:flex;gap:8px;padding:0 16px 12px;align-items:center;flex-wrap:wrap}
  .mini{font-size:12px;padding:5px 9px;border-radius:999px;color:var(--muted)}
  .mini:hover{color:var(--text)}
  /* Clarity 按钮: 输入框下方显著可见 */
  #clarityBtn{display:inline-flex;align-items:center;gap:5px;color:var(--accent);border:1px solid var(--accent);font-weight:600}
  #clarityBtn:hover{background:rgba(196,214,64,.12);color:var(--accent)}
  /* 完全访问开关 */
  #fullAccessBtn{display:inline-flex;align-items:center;gap:5px}
  #fullAccessBtn.on{color:#c0392b;border-color:#c0392b;font-weight:600}
  #fullAccessBtn.on::before{content:"●";font-size:9px}
  /* 空状态: 输入框居中, 有内容后落底部 */
  main.chat-empty #chat{display:none}
  main.chat-empty .composer-wrap{margin:auto;max-width:760px;width:100%;padding:0 24px 24px;border-top:none}
  main.chat-empty .hero{flex:1;display:grid;place-items:center;min-height:0}
  .hero h1{font-size:30px;font-weight:600;margin:0 0 6px;color:var(--text)}
  .hero p{color:var(--muted);margin:0 0 28px;font-size:14px}
  .composer-wrap{border-top:1px solid var(--line);display:flex;flex-direction:column;flex:none}
  /* 气泡头像 + 动作行 */
  .msg-row{position:relative}
  .ava-bubble{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--accent);color:#111;font-size:13px;font-weight:700;overflow:hidden;position:absolute;top:2px}
  .ava-bubble img{width:100%;height:100%;object-fit:cover}
  .msg-row.bot .ava-bubble{left:-36px}
  .msg-row.user .ava-bubble{right:-36px;border-radius:50%}
  .actions{display:flex;gap:2px;margin-top:3px;opacity:0;transition:opacity .12s}
  .msg-row:hover .actions{opacity:1}
  .act{display:inline-grid;place-items:center;width:26px;height:24px;padding:0;border:none;background:none;color:var(--muted);border-radius:6px}
  .act:hover{color:var(--text);background:var(--panel2)}
  .act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  /* 新会话浮动按钮 (消息框内左上角) */
  #newChatFloat{position:absolute;top:64px;left:14px;z-index:20;display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  main{position:relative}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(10,15,8,.45);z-index:100;display:none;place-items:center}
  .modal-mask.open{display:grid}
  .modal{background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--btn-border);border-radius:14px;min-width:340px;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
  .modal .m-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--btn-border);font-weight:600}
  .modal .m-head .grow{flex:1}
  .modal .m-body{max-height:320px;overflow:auto;padding:8px}
  .prov{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .prov:hover{background:var(--active)}
  .prov.sel{outline:2px solid var(--accent)}
  .prov b{font-size:13px}
  .prov small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .prov .badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--btn-border);color:var(--muted)}
  .room-head{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
  .room-head b{font-size:13px}
  .room-head .grow{flex:1}
  .room-messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:9px}
  .room-msg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .room-msg .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px}
  .room-msg .meta b{color:var(--text);font-size:12px}
  .room-msg .body{font-size:12px;line-height:1.55;color:var(--text);word-break:break-word}
  .room-foot{flex:none;padding:10px 12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .room-composer{flex:none;display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);align-items:flex-end}
  .room-composer textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;font-size:12px;line-height:1.5;padding:7px 9px;border-radius:10px;background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--btn-border)}
  .room-members{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:3px 0 4px;line-height:1.6;color:var(--muted)}
  .room-members span{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--btn-bg)}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .room-grip{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
  .room-grip:hover{background:linear-gradient(90deg,rgba(196,214,64,.25),transparent)}
  .room-members .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px}
  .room-members .dot.thinking{background:var(--glow);animation:pulse 1.2s infinite}
  .msg.bot.streaming{position:relative}
  .msg.bot.streaming::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.35s linear infinite}
  @keyframes shimmer{0%{background-position:180% 0}100%{background-position:-80% 0}}
  .agent-chip{cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;opacity:.5;user-select:none;background:var(--btn-bg);color:var(--btn-text)}
  .agent-chip.on{opacity:1;border-color:var(--accent);color:var(--accent);font-weight:600}
  @media(max-width:900px){
    #app.room-open{grid-template-columns:284px 1fr}
    .room-panel{position:fixed;right:0;top:0;bottom:0;width:min(360px,88vw);z-index:60}
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <img class="brand-icon" id="brandLogo" alt="Bolloon" style="background:var(--accent);display:grid;place-items:center" />
      <span>Bolloon</span>
      <button id="collapseBtn" title="折叠侧边栏" aria-label="折叠侧边栏">☰</button>
    </div>
    <div class="side-actions">
      <button class="primary icon-btn" id="newAgentBtn" title="新智能体" aria-label="新智能体">＋</button>
      <button class="icon-btn" id="newGroupBtn" title="新建群聊" aria-label="新建群聊">👥</button>
    </div>
    <div class="side-scroll">
      <div class="sec">智能体</div>
      <div id="agents"></div>
      <div class="sec">群聊</div>
      <div id="groups"></div>
      <div class="sec">会话</div>
      <div id="sessions"></div>
      <div class="sec">系统</div>
      <button id="updateBtn" style="display:none" title="一键内部更新并重启（无弹窗）">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
        <span id="updateLabel">更新</span>
      </button>
    </div>
    <div class="account" id="account">
      <div class="ava" id="accountAva" style="color:var(--text)">🜁</div>
      <div class="who"><b id="accountName">本地</b><small id="accountDid">did:pi:local</small></div>
    </div>
  </aside>
  <main class="chat-empty">
    <header>
      <b id="agentName">Bolloon 智能体</b>
      <span id="agentDid" style="color:var(--muted)"></span>
      <span class="grow"></span>
      <button id="roomBtn" class="mini" title="打开内部商议">内部商议</button>
    </header>
    <button id="newChatFloat" title="新会话（消息框左上角）" aria-label="新会话">✦</button>
    <div class="hero"><div style="text-align:center">
      <h1>我们要做什么？</h1>
      <p> Bolloon · 去中心化智能体资源交流网络</p>
    </div></div>
    <div id="chat"></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="发送消息；Enter 发送，Shift+Enter 换行"></textarea>
        <button class="primary" id="send">发送</button>
        <button id="stopBtn" title="终止当前回复" style="display:none;width:46px">⏹</button>
      </div>
      <div class="composer-footer">
        <button id="clarityBtn" class="mini" title="一键说清楚当前状态">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
          Clarity
        </button>
        <button id="fullAccessBtn" class="mini" title="完全访问权限（可随时取消）">🔓 完全访问</button>
        <span class="grow"></span>
        <button id="modelBtn" class="mini" title="模型供应商筛选">
          <svg style="vertical-align:-2px" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15h6"/></svg>
          供应商：<b id="modelLabel">默认</b>
        </button>
      </div>
    </div>
  </main>
  <div class="modal-mask" id="provModal">
    <div class="modal">
      <div class="m-head">选择模型供应商 <span class="grow"></span><button id="provClose" style="width:26px;height:26px;padding:0">×</button></div>
      <div class="m-body" id="provList"><div class="hint" style="padding:10px">加载中…</div></div>
    </div>
  </div>
  <aside id="roomPanel" class="room-panel">
    <div class="room-grip" id="roomGrip"></div>
    <div class="room-head">
      <b id="roomTitle">内部商议</b>
      <span class="tag" id="roomKind">room</span>
      <div class="grow"></div>
      <button id="roomClose" title="关闭面板" style="width:28px;height:28px;padding:0">×</button>
    </div>
    <div id="roomMessages" class="room-messages"><div class="hint" style="padding:12px">从左侧选择一个群聊，或点击「内部商议」发起智能体交流。</div></div>
    <div class="room-composer">
      <textarea id="roomInput" placeholder="交流内容（Enter 发送）"></textarea>
      <button id="roomGuideBtn">发送</button>
    </div>
    <div class="room-foot">
      <div class="room-controls" id="roomAgents"></div>
      <div class="room-members" id="roomMembers"></div>
      <div id="roomState" class="hint">未在主动交流</div>
    </div>
  </aside>
</div>

<script>
let state = null;
const $ = (id) => document.getElementById(id);
const escapeHTML = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[c]));

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  const j = await r.json().catch(() => ({ error: "响应不是 JSON" }));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function mdToHTML(src) {
  const codes = [];
  let s = String(src || "");
  s = s.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = codes.length;
    codes.push(`<pre><code>${escapeHTML(code.replace(/\n$/, ""))}</code></pre>`);
    return `\uE000CODE${i}\uE000`;
  });
  s = escapeHTML(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return s.split("\n").map(l => l.trim() ? "<p>" + l + "</p>" : "").join("").replace(/\uE000CODE(\d+)\uE000/g, (_, i) => codes[+i] || "");
}

// ---------- SVG 图标 (气泡动作按钮) ----------
const ICONS = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  branch: '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M6 15c0-4 4-5.5 9.5-6.2"/></svg>',
  share: '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.3M8.2 13.2l7.6 4.3"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M17 3l4 4L8 20H4v-4z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>',
};

function actBtn(kind, title, idx) {
  return `<button class="act" data-act="${kind}" data-idx="${idx}" title="${title}">${ICONS[kind]}</button>`;
}

function userAvatarHTML() {
  const av = localStorage.getItem("bolloon_avatar");
  return av ? `<div class="ava-bubble"><img src="${av}" alt="me"/></div>` : `<div class="ava-bubble" style="background:var(--panel2);border:1px solid var(--line)">🜁</div>`;
}

function renderChat() {
  const chat = $("chat");
  const main = document.querySelector("main");
  const msgs = (state && state.messages) || [];
  // 空态居中 / 有内容落底部
  main.classList.toggle("chat-empty", msgs.length === 0);
  chat.innerHTML = "";
  if (!msgs.length) return;
  msgs.forEach((m, i) => {
    const row = document.createElement("div");
    row.className = "msg-row " + (m.role === "user" ? "user" : "bot");
    const ava = document.createElement("div");
    ava.innerHTML = m.role === "user" ? userAvatarHTML() : `<div class="ava-bubble" title="Bolloon">🜁</div>`;
    const msg = document.createElement("div");
    msg.className = "msg " + (m.role === "user" ? "user" : "bot");
    msg.innerHTML = mdToHTML(m.content);
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.innerHTML = m.role === "user"
      ? actBtn("copy", "复制", i) + actBtn("edit", "修改", i)
      : actBtn("copy", "复制", i) + actBtn("branch", "分支", i) + actBtn("share", "分享", i) + actBtn("retry", "重试", i);
    row.appendChild(ava.firstElementChild || ava);
    row.appendChild(msg);
    row.appendChild(actions);
    chat.appendChild(row);
  });
  chat.scrollTop = chat.scrollHeight;
}

// ---------- 气泡动作 ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { return false; }
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".act");
  if (!btn) return;
  const idx = +btn.dataset.idx;
  const m = (state && state.messages || [])[idx];
  if (!m) return;
  const kind = btn.dataset.act;
  if (kind === "copy") {
    const ok = await copyText(m.content);
    btn.innerHTML = ICONS.check;
    setTimeout(() => (btn.innerHTML = ICONS.copy), 900);
    if (!ok) alert("复制失败 (浏览器拒绝), 请手动选择文本");
  } else if (kind === "branch") {
    // 分支: 复制到此为止的历史, 开新会话
    state.messages = state.messages.slice(0, idx + 1);
    state.active_session_id = null;
    renderChat();
  } else if (kind === "share") {
    const ok = await copyText(m.content);
    alert(ok ? "已复制, 可粘贴分享" : "复制失败");
  } else if (kind === "retry") {
    // 重试: 找该回复前最近一条 user 输入, 重发
    const prev = [...state.messages.slice(0, idx)].reverse().find((x) => x.role === "user");
    if (prev) { state.messages = state.messages.slice(0, idx); renderChat(); await doSend(prev.content); }
  } else if (kind === "edit") {
    // 修改: 回填输入框编辑
    $("input").value = m.content;
    $("input").focus();
  }
});

// ---------- 模型供应商弹窗 ----------
let selectedProvider = null;

$("modelBtn").addEventListener("click", async () => {
  $("provModal").classList.add("open");
  const box = $("provList");
  try {
    const j = await api("/api/providers");
    box.innerHTML = "";
    if (!(j.providers || []).length) {
      box.innerHTML = `<div class="hint" style="padding:10px">未配置供应商 (BOLLOON_BASE_URL / BOLLOON_API_KEY)</div>`;
      return;
    }
    for (const p of j.providers) {
      const el = document.createElement("div");
      el.className = "prov" + (selectedProvider === p.id ? " sel" : "");
      el.innerHTML = `<div><b>${escapeHTML(p.id)}</b><small>${escapeHTML(p.model)} · ${escapeHTML(p.base_url)}</small></div><span class="badge">${p.has_key ? "已配置 key" : "无 key"}</span>`;
      el.addEventListener("click", () => {
        selectedProvider = p.id;
        $("modelLabel").textContent = p.id;
        localStorage.setItem("bolloon_provider", p.id);
        document.querySelectorAll(".prov").forEach((x) => x.classList.remove("sel"));
        el.classList.add("sel");
      });
      box.appendChild(el);
    }
  } catch (e) {
    box.innerHTML = `<div class="hint" style="padding:10px">加载失败: ${escapeHTML(e.message)}</div>`;
  }
});
$("provClose").addEventListener("click", () => $("provModal").classList.remove("open"));
$("provModal").addEventListener("click", (e) => {
  if (e.target === $("provModal")) $("provModal").classList.remove("open");
});

// ---------- 完全访问权限 (随时开/取消) ----------
async function refreshFullAccess() {
  try {
    const j = await api("/api/permission");
    $("fullAccessBtn").classList.toggle("on", !!j.full_access);
    $("fullAccessBtn").innerHTML = (j.full_access ? "🔓 完全访问已开启" : "🔓 完全访问");
  } catch { /* 冷启动 */ }
}

$("fullAccessBtn").addEventListener("click", async () => {
  const cur = $("fullAccessBtn").classList.contains("on");
  const next = !cur;
  try {
    await api("/api/permission", { method: "POST", body: JSON.stringify({ full_access: next }) });
    await refreshFullAccess();
  } catch (e) { alert("切换失败: " + e.message); }
});

// ---------- 私有头像 (顶部显示) ----------
function applyAvatar() {
  const av = localStorage.getItem("bolloon_avatar");
  const acc = $("accountAva");
  if (av) acc.innerHTML = `<img src="${av}" style="width:100%;height:100%;object-fit:cover"/>`;
}

$("accountAva").addEventListener("click", () => {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      localStorage.setItem("bolloon_avatar", rd.result);
      applyAvatar();
      renderChat();
    };
    rd.readAsDataURL(f);
  };
  inp.click();
});

async function boot() {
  state = await api("/api/bootstrap");
  if (state.did) {
    const didEl = $("accountDid");
    if (didEl) didEl.textContent = state.did.slice(0, 22) + "…";
  }
  // 恢复上次的供应商选择
  const saved = localStorage.getItem("bolloon_provider");
  if (saved) { selectedProvider = saved; $("modelLabel").textContent = saved; }
  applyAvatar();
  refreshFullAccess();
  renderChat();
}

// ---------- 发送 / 终止 / 队列 ----------
let sendAbort = null;
let sendBusy = false;
const sendQueue = [];

async function sendMessage() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  if (sendBusy) {
    // run 期间输入排队 (queue)
    sendQueue.push(text);
    updateQueueBadge();
    return;
  }
  await doSend(text);
  // 队列按序消费
  while (sendQueue.length > 0) {
    const next = sendQueue.shift();
    updateQueueBadge();
    await doSend(next);
  }
}

async function doSend(text) {
  if (!state.messages) state.messages = [];
  state.messages.push({ role: "user", content: text });
  renderChat();
  sendBusy = true;
  $("stopBtn").style.display = "";
  sendAbort = new AbortController();
  try {
    const r = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: state.active_session_id || "default" }),
      signal: sendAbort.signal,
    });
    const j = await r.json();
    state.messages.push({ role: "assistant", content: j.reply });
  } catch (e) {
    const aborted = e.name === "AbortError";
    state.messages.push({ role: "assistant", content: aborted ? "⏹ 已终止" : "⚠ " + e.message });
  } finally {
    sendBusy = false;
    $("stopBtn").style.display = "none";
    sendAbort = null;
    renderChat();
  }
}

function stopSend() {
  if (sendAbort) sendAbort.abort();
  // 清空排队 (终止连队列一起清, 用户意图优先)
  sendQueue.length = 0;
  updateQueueBadge();
}

function updateQueueBadge() {
  const label = $("modelLabel");
  if (label && sendQueue.length > 0) {
    label.textContent = `… (排队 ${sendQueue.length})`;
  }
}

// 事件绑定在下方统一注册

// ---------- 群聊 (room 面板绑定) ----------
let roomGroupId = null;
let roomTimer = null;

async function loadGroups() {
  try {
    const j = await api("/api/groups");
    const box = $("groups");
    box.innerHTML = "";
    for (const g of (j.groups || [])) {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `<div class="ava">👥</div><div class="txt"><b>${escapeHTML(g.name)}</b><small>${g.member_count} 成员</small></div>`;
      el.addEventListener("click", () => openRoom(g));
      box.appendChild(el);
    }
  } catch (e) { /* 冷启动群列表可能为空 */ }
}

async function createGroup() {
  const name = prompt("群聊名称");
  if (!name) return;
  try {
    await api("/api/groups", { method: "POST", body: JSON.stringify({ name }) });
    await loadGroups();
  } catch (e) { alert("建群失败: " + e.message); }
}

async function openRoom(g) {
  roomGroupId = g.id;
  $("app").classList.add("room-open");
  $("roomTitle").textContent = g.name;
  $("roomKind").textContent = g.owner === (state && state.did) ? "群主" : "成员";
  $("roomMembers").innerHTML = `<span><span class="dot thinking"></span>${escapeHTML((state && state.did) || "did:pi:local").slice(0, 18)}…</span>`;
  await refreshRoom();
  clearInterval(roomTimer);
  roomTimer = setInterval(refreshRoom, 3000);
}

async function refreshRoom() {
  if (!roomGroupId) return;
  try {
    const j = await api(`/api/groups/${encodeURIComponent(roomGroupId)}/messages?after=0`);
    const box = $("roomMessages");
    box.innerHTML = "";
    for (const m of (j.messages || [])) {
      const el = document.createElement("div");
      el.className = "room-msg";
      el.innerHTML = `<div class="meta"><b>${escapeHTML(m.sender).slice(0, 24)}…</b><span>#${m.seq}</span></div><div class="body">${escapeHTML(m.content)}</div>`;
      box.appendChild(el);
    }
    box.scrollTop = box.scrollHeight;
  } catch (e) { /* 轮询失败静默, 下轮再试 */ }
}

async function sendRoom() {
  const input = $("roomInput");
  const text = input.value.trim();
  if (!text || !roomGroupId) return;
  input.value = "";
  try {
    await api(`/api/groups/${encodeURIComponent(roomGroupId)}/say`, { method: "POST", body: JSON.stringify({ text }) });
    await refreshRoom();
  } catch (e) {
    $("roomState").textContent = "发送失败: " + e.message;
  }
}

// 事件绑定
$("send").addEventListener("click", sendMessage);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("collapseBtn").addEventListener("click", () => $("app").classList.toggle("collapsed"));
$("roomBtn").addEventListener("click", () => { roomGroupId = null; $("roomTitle").textContent = "内部商议"; $("app").classList.add("room-open"); });
$("roomClose").addEventListener("click", () => { $("app").classList.remove("room-open"); clearInterval(roomTimer); });
$("newChatFloat").addEventListener("click", () => { if (state) { state.active_session_id = null; state.messages = []; renderChat(); } $("input").focus(); });
$("roomGuideBtn").addEventListener("click", sendRoom);
$("newGroupBtn").addEventListener("click", createGroup);
$("roomInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendRoom(); }
});

// ---------- 自动更新 (未检测到更新之前不显示; 一条龙无弹窗) ----------
async function checkUpdate() {
  try {
    const j = await api("/api/update/check");
    const btn = $("updateBtn");
    if (j.update_available) {
      btn.style.display = "";
      $("updateLabel").textContent = `更新 ${j.latest}`;
      btn.title = `有新版本 ${j.latest} (当前 ${j.current}) — 点击内部安装并重启`;
    } else {
      // 未检测到更新之前不显示
      btn.style.display = "none";
    }
  } catch { /* 检测失败 = 不显示 */ }
}

$("updateBtn").addEventListener("click", async () => {
  const btn = $("updateBtn");
  btn.disabled = true;
  $("updateLabel").textContent = "安装中…";
  try {
    const j = await api("/api/update/install", { method: "POST" });
    if (!j.installing) throw new Error(j.error || "安装失败");
    $("updateLabel").textContent = "重启中…";
    // 服务重启: 轮询健康, 回来后刷新页面 (无弹窗)
    const deadline = Date.now() + 30_000;
    const poll = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(poll); $("updateLabel").textContent = "重启超时, 请手动刷新"; btn.disabled = false; return; }
      try {
        await fetch("/api/health");
        clearInterval(poll);
        location.reload(); // 新版本服务就绪 → 整页刷新完成更新一条龙
      } catch { /* 服务还没回来, 继续等 */ }
    }, 800);
  } catch (e) {
    $("updateLabel").textContent = "更新失败";
    btn.disabled = false;
    setTimeout(() => ($("updateLabel").textContent = "更新"), 2500);
  }
});

// 启动时检查一次 + 每 30 分钟复查
checkUpdate();
setInterval(checkUpdate, 30 * 60 * 1000);

// ---------- Clarity 一键说清楚 ----------
async function showClarity() {
  try {
    const c = await api("/api/clarity?q=default");
    const chat = $("chat");
    const box = document.createElement("div");
    box.className = "msg-row bot";
    const lines = [];
    lines.push(`<b>◎ Clarity</b> <span style="color:var(--muted)">${c.reason} · 健康 ${c.health}/100</span>`);
    if (c.goal) lines.push(`<p><b>当前目标:</b> ${escapeHTML(c.goal)}</p>`);
    if (c.done.length) lines.push(`<p><b>已完成:</b><br>${c.done.map(escapeHTML).join("<br>")}</p>`);
    if (c.pending.length) lines.push(`<p><b>未决项:</b><br>${c.pending.map(escapeHTML).join("<br>")}</p>`);
    if (c.next_step) lines.push(`<p><b>下一步:</b> ${escapeHTML(c.next_step)}</p>`);
    if (c.blockers.length) lines.push(`<p style="color:var(--glow)"><b>阻塞:</b><br>${c.blockers.map(escapeHTML).join("<br>")}</p>`);
    box.innerHTML = `<div class="msg bot">${lines.join("")}</div>`;
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  } catch (e) {
    alert("Clarity 失败: " + e.message);
  }
}
$("clarityBtn").addEventListener("click", showClarity);
$("stopBtn").addEventListener("click", stopSend);

boot().then(loadGroups);
