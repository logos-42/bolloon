<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#141412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bolloon</title>
<style>
:root{
  --bg:#141412;--card:#1e1e1b;--card2:#262622;--line:#33332d;
  --text:#e8e8dc;--muted:#8b8b80;--accent:#c4d640;--accent-ink:#1a1a18;
  --danger:#e06a5a;--ok:#7fc86a;
  --safe-b:env(safe-area-inset-bottom,0px);
  --kb:0px;
}
html[data-theme="light"]{--bg:#f4f4ee;--card:#fff;--card2:#efefe6;--line:#dcdcd2;--text:#1c1c18;--muted:#6f6f68;--accent:#7f8c22;--accent-ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{appearance:none;border:0;background:none;padding:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:calc(48px + env(safe-area-inset-bottom) + var(--kb))}
/* iOS 全屏 WebView 会关闭安全区自动 inset（env=0），用系统常量补偿刘海/底部 */
@supports (-webkit-touch-callout: none){
  #app{padding-top:max(env(safe-area-inset-top),59px)}
  .nav{padding-bottom:max(env(safe-area-inset-bottom),34px)}
  .composer,.homebar{padding-bottom:max(env(safe-area-inset-bottom),8px)}
}

/* 顶栏 */
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 6px;background:var(--bg);z-index:10}
.top .title{flex:1;text-align:center;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text)}

/* 内容区 */
main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 18px}
.view.on{display:block}
.room{display:none;flex-direction:column;height:100%;padding:0}
.room.on{display:flex}

/* 底部导航：flex 触底，不留白 */
.nav{position:fixed;left:0;right:0;bottom:var(--kb);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:10px}
.nav button.on{color:var(--accent)}
.nav .ico{width:20px;height:20px}

/* 通用 */
.h{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--accent);overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}

/* 首页：信息流 + 底部输入栏 */
#v-home.on{display:flex;flex-direction:column;padding:0;overflow:hidden}
.homefeed{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 12px}
.top-tabs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:230px;margin:0 auto}
.top-tabs button{height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600}
.top-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
[hidden]{display:none!important}
.htabpane{display:none}
.htabpane.on{display:block}
.intent-title{font-size:18px;font-weight:700;margin:4px 2px 10px}
.intent-hint{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.replies{display:flex;flex-direction:column;gap:8px}
.reply{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.reply.me{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.reply .who{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.reply .txt{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
/* 输入后的 3px 流光进度 */
.homeprogress{flex:0 0 auto;height:3px;background:var(--line);overflow:hidden}
.homeprogress i{display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:flow 1.1s linear infinite}
@keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.homebar{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg)}
.homebar textarea{flex:1;resize:none;max-height:96px;min-height:40px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);outline:none}
.homebar .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:0 0 auto;color:var(--text)}
.mic.rec{background:var(--danger);border-color:transparent;color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}
}
/* 媒体卡片 */
.mediabox{position:relative;border-radius:14px;overflow:hidden;background:var(--card2);aspect-ratio:16/10;margin-bottom:10px}
.mediabox img,.mediabox video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
/* 无图自动生成文本封面（按标题散列配色） */
.mediaph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:12px;background:linear-gradient(155deg,hsl(var(--h,72) 46% 30%),hsl(calc(var(--h,72) + 42) 52% 17%));color:#fff}
.mediaph .mtag{font-size:10px;letter-spacing:.14em;opacity:.72;font-weight:600}
.mediaph .mtitle{font-size:17px;line-height:1.22;font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#homeFeed .mediaph{padding:9px;gap:5px}
#homeFeed .mediaph .mtitle{font-size:13.5px;-webkit-line-clamp:4}
#homeFeed .mediaph .mtag{font-size:9px}
.speak{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:rgba(20,20,18,.62);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
.sess-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px}
.sess-wrap .item{background:var(--card);margin:0;border-radius:14px}
.sess-wrap.swiped .item{transform:translateX(-76px);transition:transform .2s}
.sess-del{position:absolute;right:0;top:0;bottom:0;width:76px;background:var(--danger);color:#fff;display:grid;place-items:center;font-size:13px;transform:translateX(100%);transition:transform .2s;z-index:1}
.sess-wrap.swiped .sess-del{transform:none}
.qrthumb{width:58px;height:58px;padding:4px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.qrthumb svg{width:100%;height:100%}
.qrbig{background:#fff;padding:18px;border-radius:18px;display:grid;place-items:center}
.qrbig svg{width:min(88vw,520px);height:min(88vw,520px)}
.facebox{width:100%;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.facebox video,.facebox img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* 列表 */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.item:active{background:var(--card2)}
.item .t{font-size:14.5px;font-weight:550;display:block}
.item .d{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
/* 「我」页列表更紧凑 */
#v-me .item{padding:6px 12px;gap:9px;border-radius:12px}
#v-me .item .av{width:26px;height:26px;font-size:11px}
#v-me .item .t{font-size:13.5px}
#v-me .item .d{font-size:10.5px;margin-top:0}

/* 世界卡片：双列 */
.feed{display:flex;flex-direction:column;gap:10px}
#homeFeed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feedcard{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.feedcard h4{margin:0 0 6px;font-size:14.5px;line-height:1.4}
.feedcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.feedcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#homeFeed .feedcard{padding:10px;border-radius:14px}
#homeFeed .feedcard h4{font-size:13px;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#homeFeed .feedcard p{font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#homeFeed .mediabox{aspect-ratio:9/16;margin-bottom:8px;border-radius:11px}
#homeFeed .speak{width:26px;height:26px;right:6px;top:6px}
#homeFeed .meta{margin-top:8px;gap:4px}
#homeFeed .badge{font-size:9px;padding:2px 6px}
#homeFeed .empty{grid-column:1/-1}

/* 聊天 */
.msgs{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;resize:none;max-height:104px;min-height:40px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);outline:none}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.composer .send:disabled{opacity:.4}
.roomhead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}

/* 抽屉 */
#drawer{position:fixed;inset:0;z-index:50;display:none}
#drawer.on{display:block}
#drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#drawer .panel{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:360px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
#drawer .head{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
#drawer .body{flex:1;overflow-y:auto;padding:6px 12px calc(env(safe-area-inset-bottom) + 14px)}
#drawer .sec{font-size:11px;color:var(--muted);margin:14px 6px 6px;letter-spacing:.08em}
#drawer .sess{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;width:100%;text-align:left}
#drawer .sess:active{background:var(--card2)}
#drawer .sess.on{background:var(--card);border:1px solid var(--line)}
#drawer .sess .t{display:block;font-size:14px;font-weight:550}
#drawer .sess .d{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.drawer-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 14px calc(var(--safe-b) + 12px)}
.drawer-foot button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;color:var(--text);font-size:14px;background:var(--card)}
.drawer-foot button .ico{width:18px;height:18px;color:var(--accent)}

/* 子页 */
.sub{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sub.on{transform:none}
.sub .bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sub .bar .t{font-weight:650;font-size:16px}
.sub .body{flex:1;overflow-y:auto;padding:14px 16px calc(var(--safe-b) + 22px)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:550}
.btn:active{background:var(--card2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1;min-width:118px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv .k{color:var(--muted)}.kv .v{text-align:right;word-break:break-all;max-width:62%}
pre.blob{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--card2);padding:10px;border-radius:10px;max-height:160px;overflow:auto}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

/* iOS 输入法候选/聚焦时不要出现白色浮层 */
.composer textarea,#needInput{-webkit-appearance:none;appearance:none;background:var(--card)!important;color:var(--text)!important;outline:none;box-shadow:none;-webkit-tap-highlight-color:transparent}
.composer textarea:focus,#needInput:focus{background:var(--card)!important;color:var(--text)!important;outline:none;box-shadow:none}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 108px);transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="round" id="btnMenu" aria-label="历史会话">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title" id="topTitle">首页</div>
    <div class="hometabs top-tabs" id="homeTabs" hidden>
      <button type="button" class="on" data-htab="world">世界</button>
      <button type="button" data-htab="intent">我的意图</button>
    </div>
    <button class="round" id="btnNew" aria-label="新对话">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main>
    <!-- 首页：世界意图 + 媒体卡片 -->
    <section class="view on" id="v-home">
      <div class="homefeed" id="homeScroll">
        <div class="htabpane on" id="pane-world">
          <div class="feed" id="homeFeed"></div>
        </div>
        <div class="htabpane" id="pane-intent">
          <div class="intent-title">我的意图</div>
          <div class="chips" id="intentChips"></div>
          <div class="intent-hint">在下方输入框说出你的需求，会分发给世界和联系人一起帮忙。</div>
          <div class="h" style="margin-top:18px">回应</div>
          <div class="replies" id="intentReplies"></div>
        </div>
      </div>
      <div class="homeprogress" id="homeProgress" hidden><i></i></div>
      <div class="homebar">
        <button class="mic" id="btnMic" aria-label="语音输入">
          <svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
        </button>
        <textarea id="needInput" rows="1" placeholder="说出你需要什么帮助…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></textarea>
        <button class="send" id="btnNeed" aria-label="发送">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
        </button>
      </div>
    </section>

    <!-- 任务：对话 -->
    <section class="view" id="v-tasks">
      <div class="h">智能体</div>
      <div class="chips" id="agentChips"></div>
      <div class="h">会话</div>
      <div class="list" id="taskList"></div>
    </section>

    <!-- 联系人 -->
    <section class="view" id="v-contacts">
      <div class="row" style="margin-top:8px">
        <input id="contactSearch" placeholder="搜索 DID / 备注名" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none">
        <button class="round" id="btnAddContact" aria-label="添加">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="h">联系人</div>
      <div class="list" id="contactList"></div>
      <div class="h">待处理</div>
      <div class="list" id="requestList"></div>
    </section>

    <!-- 我 -->
    <section class="view" id="v-me">
      <div class="card" style="margin-top:8px">
        <div class="row">
          <div class="av" id="meAv" style="width:52px;height:52px;font-size:18px" title="点击更换头像">B</div>
          <input type="file" id="avatarFile" accept="image/*" hidden>
          <div class="grow">
            <div style="font-size:17px;font-weight:650" id="meName">未命名</div>
            <div class="tiny muted truncate" id="meDid">—</div>
          </div>
          <span id="qrSlot"></span>
        </div>
        <div class="row" style="margin-top:14px;gap:18px">
          <div><div style="font-size:18px;font-weight:700" id="statAgents">0</div><div class="tiny muted">智能体</div></div>
          <div><div style="font-size:18px;font-weight:700" id="statSessions">0</div><div class="tiny muted">会话</div></div>
          <div><div style="font-size:18px;font-weight:700" id="statContacts">0</div><div class="tiny muted">联系人</div></div>
        </div>
      </div>
      <div class="h">功能</div>
      <div class="list">
        <button class="item" data-open="agentwallet"><span class="av">A</span><span class="grow"><span class="t">智能体钱包</span><span class="d">当前智能体的链上地址</span></span><span class="badge">›</span></button>
        <button class="item" data-open="wallet"><span class="av">W</span><span class="grow"><span class="t">钱包与代币</span><span class="d">地址、备份、导入与发币</span></span><span class="badge">›</span></button>
        <button class="item" data-open="plugins"><span class="av">P</span><span class="grow"><span class="t">插件</span><span class="d">创建、导入、分享</span></span><span class="badge">›</span></button>
        <button class="item" data-open="models"><span class="av">M</span><span class="grow"><span class="t">模型</span><span class="d">供应商与连接测试</span></span><span class="badge">›</span></button>
        <button class="item" data-open="pay"><span class="av">¥</span><span class="grow"><span class="t">额度</span><span class="d">余额、用量、申报充值</span></span><span class="badge">›</span></button>

<div id="toast"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d;};

const API_BASE=(location.protocol==='tauri:'||location.hostname.indexOf('tauri')>=0)?'http://127.0.0.1:54188':'';
const api={
  async get(p){const r=await fetch(API_BASE+p,{headers:{Accept:'application/json'}});const t=await r.text();let d;try{d=JSON.parse(t);}catch(_){d=t;}if(!r.ok)throw new Error((d&&d.error)||('GET '+p+' → '+r.status));return d;},
  async post(p,b){const r=await fetch(API_BASE+p,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();let d;try{d=JSON.parse(t);}catch(_){d=t;}if(!r.ok)throw new Error((d&&d.error)||('POST '+p+' → '+r.status));return d;}
};
let toastTimer=0;
function toast(m,ms=2400){const el=$('#toast');if(!el)return;el.textContent=String(m||'');el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),ms);}
function fail(e){toast(e&&e.message?e.message:'操作失败',3200);console.error(e);}

/* 主题 */
const THEME_KEY='bolloon_theme';
const themePref=()=>{try{return localStorage.getItem(THEME_KEY)||'auto';}catch(_){return 'auto';}};
function applyTheme(pref){
  const sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  const mode=pref==='light'||pref==='dark'?pref:sys;
  document.documentElement.dataset.theme=mode;
  const el=$('#themeLabel');if(el)el.textContent=pref==='auto'?'跟随系统':(pref==='light'?'浅色':'深色');
  try{localStorage.setItem(THEME_KEY,pref);}catch(_){}
}
function cycleTheme(){const p=themePref();applyTheme(p==='auto'?'light':(p==='light'?'dark':'auto'));}

/* 状态 */
const S={boot:null,agents:[],sessions:[],contacts:[],agentId:'',sessionId:'',tab:'home'};
const sessionsOf=a=>S.sessions.filter(s=>!a||s.agent_id===a).sort((x,y)=>(y.pinned?1:0)-(x.pinned?1:0)||num(y.created_at_ms)-num(x.created_at_ms));
const activeSession=()=>S.sessions.find(s=>s.id===S.sessionId)||null;
const activeAgent=()=>S.agents.find(a=>a.id===S.agentId)||S.agents[0]||null;

async function refreshBoot(){
  const d=await api.get('/api/bootstrap');const st=d.state||{};
  S.boot=d;S.agents=st.agents||[];S.sessions=st.sessions||[];
  S.agentId=st.active_agent_id||S.agentId||(S.agents[0]&&S.agents[0].id)||'';
  S.sessionId=st.active_session_id||S.sessionId;
  renderTop();renderMe();renderTasks();renderDrawer();
  return d;
}

function renderTop(){
  const a=activeAgent();
  const isHome=S.tab==='home';
  const tt=$('#topTitle'), ht=$('#homeTabs');
  if(tt){tt.hidden=isHome;tt.textContent=S.tab==='tasks'?'任务':S.tab==='contacts'?'联系人':'我';}
  if(ht)ht.hidden=!isHome;
  const nm=a?a.name||a.id:'Bolloon';
  $('#drawerName').textContent=nm;
  $('#drawerSub').textContent=S.agents.length?('本地内核 · '+S.agents.length+' 个智能体'):'本地内核';
  $('#drawerAv').innerHTML=a&&a.avatar?'<img alt="" src="'+esc(a.avatar)+'">':esc((nm[0]||'B').toUpperCase());
}

function renderMe(){
  const p=(S.boot&&S.boot.state&&S.boot.state.profile)||{};
  const nm=p.name||'未命名';
  $('#meName').textContent=nm;
  $('#meDid').textContent=(S.boot&&S.boot.state&&S.boot.state.did)||'—';
  $('#meAv').innerHTML=p.avatar?'<img alt="" src="'+esc(p.avatar)+'">':esc((nm[0]||'B').toUpperCase());
  $('#statAgents').textContent=String(S.agents.length);
  $('#statSessions').textContent=String(S.sessions.length);
  $('#statContacts').textContent=String(S.contacts.length);
  const v=$('#appVersion');if(v)v.textContent=(S.boot&&S.boot.version)||'—';
}

function showTab(t){
  const prev=S.tab;
  S.tab=t;
  $$('.view').forEach(v=>v.classList.remove('on'));
  const v=$('#v-'+t);if(v)v.classList.add('on');
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderTop();
  if(t==='tasks'){
    // 每次进入任务页默认新会话；已有空会话则复用，历史会话仍在抽屉里
    if(prev!=='tasks') ensureFreshSession().catch(fail);
    else renderTasks();
  }
  if(t==='contacts')loadContacts().catch(fail);
  if(t==='me')renderMe();
  if(t==='home')loadHome().catch(fail);
}

/* 任务：会话 */
function renderTasks(){
  const a=activeAgent();
  const chips=$('#agentChips');
  chips.innerHTML=S.agents.map(x=>'<button class="chip'+(x.id===S.agentId?' on':'')+'" data-agent="'+esc(x.id)+'">'+esc(x.name||x.id)+'</button>').join('')||'<span class="small muted">还没有智能体</span>';
  const list=sessionsOf(S.agentId);
  $('#taskList').innerHTML=list.length?list.map(s=>{
    const last=(s.messages&&s.messages.length)?(s.messages[s.messages.length-1].content||''):'';
    return '<button class="item" data-session="'+esc(s.id)+'"><span class="av">'+(s.pinned?'★':'C')+'</span><span class="grow"><span class="t truncate">'+esc(s.title||'新对话')+'</span><span class="d truncate">'+esc(last||'点击继续')+'</span></span><span class="badge">›</span></button>';
  }).join(''):'<div class="empty"><b>还没有会话</b>点右上角 + 新建</div>';
  if(a) $('#roomSub').textContent=a.name||a.id;
}

function openRoom(id){
  S.tab='tasks'; // 从抽屉/首页进入聊天后，关闭时回到任务页且不再新建会话
  S.sessionId=id||S.sessionId;
  const s=activeSession();
  $('#roomTitle').textContent=s?(s.title||'对话'):'对话';
  $('#roomSub').textContent=(activeAgent()||{}).name||'智能体';
  $$('.view').forEach(v=>v.classList.remove('on'));
  $('#v-room').classList.add('on');
  renderMsgs();
}
function closeRoom(){ showTab('tasks'); }

function renderMsgs(){
  const s=activeSession();const box=$('#msgs');if(!box)return;
  const msgs=(s&&s.messages)||[];
  box.innerHTML=msgs.map(m=>'<div class="msg '+(m.role==='user'?'me':'ai')+'">'+esc(m.content||'')+'</div>').join('')||'<div class="empty"><b>开始对话</b>输入你的问题</div>';
  box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
  const ta=$('#input');const text=(ta.value||'').trim();if(!text)return;
  const s=activeSession();if(!s){toast('先新建会话');return;}
  const btn=$('#btnSend');btn.disabled=true;
  const box=$('#msgs');const empty=box.querySelector('.empty');if(empty)empty.remove();
  box.insertAdjacentHTML('beforeend','<div class="msg me">'+esc(text)+'</div>');
  ta.value='';ta.style.height='auto';box.scrollTop=box.scrollHeight;
  try{
    const d=await api.post('/api/chat',{message:text,session_id:s.id,agent_id:S.agentId});
    const reply=(d&&(d.reply||d.message))||'（无回复）';
    box.insertAdjacentHTML('beforeend','<div class="msg ai">'+esc(reply)+'</div>');
    box.scrollTop=box.scrollHeight;
    s.messages=s.messages||[];s.messages.push({role:'user',content:text},{role:'assistant',content:reply});
    renderTasks();
  }catch(e){fail(e);}finally{btn.disabled=false;}
}
async function newChat(){
  try{
    const d=await api.post('/api/sessions',{agent_id:S.agentId});
    await refreshBoot();
    S.sessionId=(d&&(d.id||d.session_id))||S.sessionId;
    openRoom(S.sessionId);
  }catch(e){fail(e);}
}
async function pickSession(id){S.sessionId=id;try{await api.post('/api/active',{agent_id:S.agentId,session_id:id});}catch(_){}openRoom(id);}
async function ensureFreshSession(){
  await refreshBoot(); // 先拿最新会话与消息，避免用旧缓存误判“空会话”
  const list=sessionsOf(S.agentId);
  const last=list[0];
  // 最新会话还是空的就不再造一条；否则新建，旧会话保留
  if(last && (!last.messages || last.messages.length===0)){ S.sessionId=last.id; renderTasks(); return; }
  const d=await api.post('/api/sessions',{agent_id:S.agentId});
  await refreshBoot();
  S.sessionId=(d&&(d.id||d.session_id))||S.sessionId;
  renderTasks();
}

/* 抽屉：历史会话 */
async function renderDrawer(){
  const body=$('#drawerBody');
  const groups=S.agents.map(a=>({a,list:sessionsOf(a.id)})).filter(g=>g.list.length);
  const rest=sessionsOf('');
  let html='<div class="sec">历史会话</div>';
  if(!S.sessions.length)html+='<div class="empty">还没有会话</div>';
  const renderSess=s=>'<button class="sess'+(s.id===S.sessionId?' on':'')+'" data-session="'+esc(s.id)+'"><span class="av">'+(s.pinned?'★':'C')+'</span><span class="grow"><span class="t truncate">'+esc(s.title||'新对话')+'</span><span class="d truncate">'+esc(s.agent_id||'')+'</span></span></button>';
  if(groups.length){groups.forEach(g=>{html+='<div class="sec">'+esc(g.a.name||g.a.id)+'</div>'+g.list.map(renderSess).join('');});}
  else html+=rest.map(renderSess).join('');
  // 群组记录
  try{
    const g=await api.get('/api/groups');
    const list=g.groups||g.items||[];
    html+='<div class="sec">群组记录</div>';
    html+=list.length?list.map(x=>'<button class="sess" data-group="'+esc(x.id||x.group_id||x.name||'')+'"><span class="av">G</span><span class="grow"><span class="t truncate">'+esc(x.name||x.title||x.id||'群组')+'</span><span class="d truncate">'+esc(x.members?'成员 '+x.members:'群组')+'</span></span></button>').join(''):'<div class="empty">还没有群组</div>';
  }catch(_){html+='<div class="sec">群组记录</div><div class="empty">加载失败</div>';}
  body.innerHTML=html;
}
function openDrawer(){renderDrawer();$('#drawer').classList.add('on');}
function closeDrawer(){$('#drawer').classList.remove('on');}

/* 首页 */
function mediaOf(x){
  const m=(x.media&&typeof x.media==='object')?x.media:{};
  const img=x.image||x.image_url||x.cover||x.cover_url||x.thumbnail||x.poster||(typeof x.media==='string'?x.media:'')||m.image||m.cover||m.url||'';
  const video=x.video||x.video_url||m.video||'';
  return {img,video};
}
const PLAY_SVG='<svg class="ico" viewBox="0 0 24 24"><path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor" stroke="none"/></svg>';
const GEAR_SVG='<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>';
function hueOf(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))%360;return h;}
function showProgress(on){const el=$('#homeProgress');if(el)el.hidden=!on;}
function fmtTs(ts){const n=Number(ts);if(!Number.isFinite(n)||n<=0)return '';const d=new Date(n<1e12?n*1000:n);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function normCard(raw){
  const nested=(raw&&raw.card&&typeof raw.card==='object')?raw.card:{};
  const x=Object.assign({},nested,raw||{});
  return {
    id:x.id||x.card_id||'',
    title:x.title||x.summary||x.text||'',
    summary:x.summary||x.description||x.digest||'',
    cover:x.cover||x.image||x.image_url||x.thumbnail||x.poster||'',
    media:x.media||null,
    video:x.video||x.video_url||'',
    from:x.from||x.provider||x.issuer||'',
    verification:x.verification||'',
    ts:x.ts||x.created_at_ms||0,
    score:x.score
  };
}
function renderReplies(list){
  const el=$('#intentReplies');if(!el)return;
  const th=(list||[]).filter(m=>m&&(m.text||m.content)).slice(-30).reverse();
  el.innerHTML=th.length?th.map(m=>'<div class="reply '+(m.role==='human'?'me':'')+'"><div class="who">'+esc(m.role==='human'?'我':(m.from||m.role||'世界'))+(m.ts?' · '+esc(fmtTs(m.ts)):'')+'</div><div class="txt">'+esc(m.text||m.content||'')+'</div></div>').join(''):'<div class="empty">还没有回应，发出需求后世界和联系人会在这里回应</div>';
}
async function loadHome(){
  showProgress(true);
  try{
    const [ints,feed,cards,inbox,thread]=await Promise.all([
      api.get('/api/world/intents').catch(()=>({intents:[]})),
      api.get('/api/world/feed').catch(()=>({feed:[]})),
      api.get('/api/world/cards').catch(()=>({cards:[]})),
      api.get('/api/world/inbox').catch(()=>({items:[]})),
      api.get('/api/world/thread').catch(()=>({thread:[]}))
    ]);
    const intents=ints.intents||[];
    $('#intentChips').innerHTML=intents.length?intents.map(t=>'<span class="chip">'+esc(typeof t==='string'?t:(t.text||t.name||''))+'</span>').join(''):'<span class="small muted">还没有意图，先写下你的需求</span>';
    const feedItems=(feed.feed||feed.items||[]);
    const cardItems=(cards.cards||[]).map(normCard);
    const inboxItems=(inbox.items||[]).filter(x=>!x.kind||x.kind==='card').map(normCard);
    const seen=new Set();const items=[];
    [...feedItems,...cardItems,...inboxItems].forEach(raw=>{
      const x=normCard(raw);
      if(!x.title&&!x.summary)return;
      const k=x.id||((x.title||'')+'|'+x.from);
      if(seen.has(k))return;seen.add(k);items.push(x);
    });
    items.sort((a,b)=>num(b.score)-num(a.score));
    $('#homeFeed').innerHTML=items.length?items.map(x=>{
      const title=x.title||'未命名机会';
      const desc=x.summary||'';
      const score=x.score!=null?Math.round(num(x.score)*100)+'%':'';
      const {img,video}=mediaOf(x);
      const spoken=encodeURIComponent([title,desc].filter(Boolean).join('。'));
      const tagName=esc((x.from||'世界').replace(/^did:pi:/,'').slice(0,10));
      let media='';
      if(video){
        media='<div class="mediabox"><video src="'+esc(video)+'"'+(img?' poster="'+esc(img)+'"':'')+' playsinline preload="metadata"></video><button class="speak" data-vplay="1" aria-label="播放">'+PLAY_SVG+'</button></div>';
      }else if(img){
        media='<div class="mediabox"><img loading="lazy" src="'+esc(img)+'" alt=""></div>';
      }else{
        // 无图：按标题散列自动生成文本封面（智能体设计）
        media='<div class="mediabox"><div class="mediaph" style="--h:'+hueOf(title)+'"><span class="mtag">'+tagName+'</span><span class="mtitle">'+esc(title)+'</span></div></div>';
      }

/* 语音输入：录音 → WAV → /api/asr（WKWebView 不支持 Web Speech） */
let voiceRec=null, recCtx=null, recStream=null, recNode=null, recBuf=[], recActive=false;
function encodeWav(chunks, srcRate){
  const total=chunks.reduce((n,c)=>n+c.length,0);
  const pcm=new Float32Array(total); let off=0;
  chunks.forEach(c=>{pcm.set(c,off);off+=c.length;});
  const target=16000, ratio=srcRate/target;
  const len=Math.floor(pcm.length/ratio), out=new Int16Array(len);
  for(let i=0;i<len;i++){
    let s=0,c=0; const a=Math.floor(i*ratio), b=Math.min(Math.floor((i+1)*ratio),pcm.length);
    for(let j=a;j<b;j++){s+=pcm[j];c++;}
    s=s/(c||1); out[i]=Math.max(-1,Math.min(1,s))*0x7fff;
  }
  const buf=new ArrayBuffer(44+out.length*2), v=new DataView(buf);
  const ws=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+out.length*2,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,out.length*2,true); new Int16Array(buf,44).set(out);
  return new Blob([buf],{type:'audio/wav'});
}
async function startVoice(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){ return fallbackSpeech(); }
  try{
    const stream=await md.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    const Ctx=window.AudioContext||window.webkitAudioContext;
    const ctx=new Ctx(); const src=ctx.createMediaStreamSource(stream);
    const node=ctx.createScriptProcessor(4096,1,1); recBuf=[]; recActive=true;
    node.onaudioprocess=e=>{ if(recActive) recBuf.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    src.connect(node); node.connect(ctx.destination);
    recCtx=ctx; recStream=stream; recNode=node;
    $('#btnMic').classList.add('rec'); toast('录音中，再点一次结束',1600);
  }catch(e){ toast('无法使用麦克风：'+((e&&e.message)||e)); }
}
async function stopVoice(){
  recActive=false;
  const ctx=recCtx, stream=recStream, node=recNode;
  recCtx=null; recStream=null; recNode=null;
  try{node&&node.disconnect();stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close();}catch(_){}
  $('#btnMic').classList.remove('rec');
  const chunks=recBuf; recBuf=[];
  if(!chunks.length){toast('没有录到声音');return;}
  const rate=ctx?ctx.sampleRate:44100;
  toast('识别中…',5000);
  try{
    const r=await fetch(API_BASE+'/api/asr',{method:'POST',headers:{'Content-Type':'audio/wav'},body:encodeWav(chunks,rate)});
    const d=await r.json();
    if(d.ok&&d.text){ $('#needInput').value=d.text; toast('已转成文字'); }
    else toast((d.error||'识别失败')+(d.hint?'：'+d.hint:''),4500);
  }catch(_){ toast('识别请求失败'); }
}
function fallbackSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前设备不支持语音输入');return;}
  if(voiceRec){try{voiceRec.stop();}catch(_){}voiceRec=null;$('#btnMic').classList.remove('rec');return;}
  voiceRec=new SR();voiceRec.lang='zh-CN';voiceRec.interimResults=true;
  voiceRec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;const inp=$('#needInput');if(inp)inp.value=t;};
  voiceRec.onerror=e=>toast('语音输入失败：'+(e.error||'未知'));
  voiceRec.onend=()=>{voiceRec=null;$('#btnMic').classList.remove('rec');};
  try{voiceRec.start();$('#btnMic').classList.add('rec');toast('请说话…',1500);}catch(_){toast('无法启动语音输入');}
}
function toggleVoice(){ if(recActive) stopVoice(); else startVoice(); }
function speak(text){
  if(!('speechSynthesis' in window)){toast('当前设备不支持朗读');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';
    speechSynthesis.speak(u);
  }catch(_){toast('朗读失败');}
}

/* 手势：左右滑动切 tab；右滑返回上一级；下滑关闭弹层 */
const TAB_ORDER=['home','tasks','contacts','me'];
const overlayOpen=()=>$('#sub').classList.contains('on')||$('#drawer').classList.contains('on')||$('#v-room').classList.contains('on');
function closeTop(){
  if($('#sub').classList.contains('on'))return closeSub();
  if($('#drawer').classList.contains('on'))return closeDrawer();
  if($('#v-room').classList.contains('on'))return closeRoom();
}
let tStart=null;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const t=e.target;
  if(t.closest('input,textarea,video,.agents'))return;
  tStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()};
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!tStart)return;
  const t=e.changedTouches[0];const dx=t.clientX-tStart.x,dy=t.clientY-tStart.y,dt=Date.now()-tStart.time;
  tStart=null;if(dt>700)return;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>60&&ax>ay*1.3){
    if(overlayOpen()){ if(dx>0)closeTop(); return; }
    const i=TAB_ORDER.indexOf(S.tab);
    if(dx<0&&i<TAB_ORDER.length-1)showTab(TAB_ORDER[i+1]);
    else if(dx>0&&i>0)showTab(TAB_ORDER[i-1]);
    return;
  }
  if(dy>70&&ay>ax*1.3&&overlayOpen())closeTop();
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop();});

    const q=($('#csQuery').value||'').trim();if(!q){toast('先输入关键词');return;}
    toast('搜索中…',1500);
    try{render(await api.post('/api/contacts/search',{query:q}));}catch(e){fail(e);}
  };
  $('#csResult').onclick=async e=>{
    const b=e.target.closest('[data-cdid]');if(!b)return;
    try{const d=await api.post('/api/contacts/connect',{did:b.dataset.cdid});toast(d.ok?'已连接':'连接失败',3200);if(d.ok){closeSub();loadContacts().catch(()=>{});}}catch(err){fail(err);}
  };
  $('#csSave').onclick=()=>{
    const did=($('#csDid').value||'').trim();if(!did){toast('先填 DID');return;}
    api.post('/api/contacts/set',{did,name:$('#csName').value||''}).then(()=>{toast('已保存');closeSub();loadContacts().catch(()=>{});}).catch(fail);
  };
};

/* 键盘高度：visualViewport → --kb，避免底栏遮输入框 */
const vv=window.visualViewport;
if(vv){
  const syncKb=()=>{
    const kb=Math.max(0, Math.round((window.innerHeight||0)-(vv.height||0)-(vv.offsetTop||0)));
    document.documentElement.style.setProperty('--kb',kb+'px');
  };
  vv.addEventListener('resize',syncKb);vv.addEventListener('scroll',syncKb);syncKb();
}

/* ── 覆盖：插件 = 智能体分享 + 自己生成 ── */
SUBLD.plugins=async()=>{
  const d=await api.get('/api/plugins').catch(()=>({plugins:[]}));
  const list=d.plugins||[];
  const isShared=p=>!!(p.shared_by||p.from_agent||p.source==='shared'||p.source==='imported'||p.owner&&p.owner!==(S.boot&&S.boot.state&&S.boot.state.did));
  const group=(title,arr,empty)=>'<div class="h">'+title+' '+arr.length+'</div><div class="list">'+(arr.length?arr.map(p=>'<div class="card" style="margin-bottom:8px"><div class="row"><div class="grow"><div style="font-weight:600">'+esc(p.name)+'</div><div class="small muted">'+esc(p.description||p.shared_by||p.source||'')+'</div></div></div><div class="btns" style="margin-top:8px"><button class="btn" data-pshare="'+esc(p.name)+'">分享</button><button class="btn danger" data-pdel="'+esc(p.name)+'">删除</button></div></div>').join(''):'<div class="empty">'+empty+'</div>')+'</div>';
  $('#subBody').innerHTML=
    '<div class="card col"><div class="field"><label>自己生成插件</label><input id="pName" placeholder="名称"></div>'+
    '<div class="field"><label>正文（sh / bash / python3 / node）</label><textarea id="pBody" rows="3" placeholder="echo hello"></textarea></div>'+
    '<button class="btn primary" data-pact="create">创建</button>'+
    '<div class="field"><label>导入别人分享的插件</label><textarea id="pBlob" rows="2" placeholder="bolloon-plugin/1..."></textarea></div>'+
    '<button class="btn" data-pact="import">导入</button></div>'+
    group('智能体 / 好友分享的插件',list.filter(isShared),'还没有收到的插件')+
    group('自己生成的插件',list.filter(p=>!isShared(p)),'还没有自己生成的插件');
  $('#subBody').onclick=async e=>{
    const c=e.target.closest('[data-pact]');
    if(c){
      try{
        if(c.dataset.pact==='create'){const r=await api.post('/api/plugins/create',{name:$('#pName').value,body:$('#pBody').value});toast(r.error||'已创建');}
        else {const r=await api.post('/api/plugins/import',{blob:$('#pBlob').value});toast(r.error||'已导入');}
        SUBLD.plugins();
      }catch(err){fail(err);}
      return;
    }
    const sh=e.target.closest('[data-pshare]');
    if(sh){try{const r=await api.get('/api/plugins/share?name='+encodeURIComponent(sh.dataset.pshare));const blob=r.blob||'';if(navigator.clipboard)navigator.clipboard.writeText(blob).catch(()=>{});$('#subBody').insertAdjacentHTML('afterbegin','<div class="card"><pre class="blob">'+esc(blob)+'</pre></div>');}catch(err){fail(err);}return;}
    const del=e.target.closest('[data-pdel]');
    if(del&&confirm('删除 '+del.dataset.pdel+'？')){try{await api.post('/api/plugins/remove',{name:del.dataset.pdel});SUBLD.plugins();}catch(err){fail(err);}}
  };
};

/* ── 覆盖：任务页（新建智能体 + 左滑删除 + AI 命名） ── */
const _renderTasks=renderTasks;
renderTasks=function(){
  const chips=$('#agentChips');if(!chips)return;
  chips.innerHTML=S.agents.map(x=>'<button class="chip'+(x.id===S.agentId?' on':'')+'" data-agent="'+esc(x.id)+'">'+esc(x.name||x.id)+'</button>').join('')+'<button class="chip" id="btnAddAgent" title="新建智能体">＋</button>';
  const list=sessionsOf(S.agentId);
  $('#taskList').innerHTML=list.length?list.map(s=>{
    const last=(s.messages&&s.messages.length)?(s.messages[s.messages.length-1].content||''):'';
    return '<div class="sess-wrap" data-sid="'+esc(s.id)+'"><button class="item" data-session="'+esc(s.id)+'"><span class="av">'+(s.pinned?'★':'C')+'</span><span class="grow"><span class="t truncate">'+esc(s.title||'新对话')+'</span><span class="d truncate">'+esc(last||'点击继续')+'</span></span><span class="badge">›</span></button><button class="sess-del" data-del="'+esc(s.id)+'">删除</button></div>';
  }).join(''):'<div class="empty"><b>还没有会话</b>右上角 + 新建</div>';
};
const _sendMsg=sendMsg;
async function aiTitle(text,id){
  try{
    const tmp=await api.post('/api/sessions',{agent_id:S.agentId});
    const r=await api.post('/api/chat',{message:'请只输出一个不超过 12 字的中文标题，不要解释、不要引号：'+String(text).slice(0,220),session_id:tmp.id,agent_id:S.agentId});
    await api.post('/api/sessions/delete',{id:tmp.id}).catch(()=>{});
    const name=String((r&&(r.reply||r.message))||'').trim().replace(/^["「『]|["」』]$/g,'').slice(0,20);
    if(name){await api.post('/api/sessions/update',{id,title:name});await refreshBoot();}
  }catch(_){}
}
const AI_TITLED=new Set();
$('#btnSend').onclick=()=>sendMsg();
sendMsg=async function(){
  const s=activeSession(),ta=$('#input');
  const first=(ta&&ta.value||'').trim();
  const need=!!s && !AI_TITLED.has(s.id);
  if(s)AI_TITLED.add(s.id);
  await _sendMsg();
  if(need&&first)setTimeout(()=>aiTitle(first,s.id),800);
};

/* ── 二维码连接（15s 轮换；展开时冻结） ── */
let qrSvg='',qrUrl='',qrTimer=0;
async function refreshQr(){
  try{
    const d=await api.post('/api/auth/qr/issue',{});
    qrSvg=d.svg||'';qrUrl=d.url||'';
    const t=$('#qrThumb');if(t)t.innerHTML=qrSvg;
    const b=$('#qrBig');if(b)b.innerHTML=qrSvg;
    const l=$('#qrLink');if(l)l.value=qrUrl;
  }catch(_){}
}
function qrFrozen(){return !!document.querySelector('#sub.on')&&$('#subTitle').textContent==='连接二维码';}
const _renderMe=renderMe;
renderMe=function(){
  _renderMe();
  const box=$('#qrSlot');if(box)box.innerHTML='<button class="qrthumb" id="btnQr" title="连接二维码">'+qrSvg+'</button>';
};
SUBS.addagent='新建智能体';SUBS.qr='连接二维码';
SUBLD.addagent=async()=>{
  $('#subBody').innerHTML='<div class="card col"><div class="field"><label>智能体名字</label><input id="agName" placeholder="例如 研究助手"></div><button class="btn primary" id="agCreate">创建</button><div class="small muted">创建后可在智能体横滑栏切换。</div></div>';
  $('#agCreate').onclick=()=>{
    const name=($('#agName').value||'').trim();if(!name){toast('先填名字');return;}
    api.post('/api/agents',{name}).then(async()=>{toast('已创建');await refreshBoot();closeSub();renderTasks();}).catch(fail);
  };
};
SUBLD.qr=async()=>{
  $('#subBody').innerHTML='<div class="card col"><div class="qrbig" id="qrBig">'+qrSvg+'</div>'+
    '<div class="field"><label>bolloon 连接</label><input id="qrLink" readonly value="'+esc(qrUrl)+'"></div>'+
    '<div class="btns"><button class="btn" id="qrCopy">复制链接</button><button class="btn primary" id="qrSave">保存图片</button></div>'+
    '<div class="small muted" style="line-height:1.55">二维码每 15 秒自动更换；展开此页时冻结不换。手机扫码 / 打开 bolloon:// 链接即可连接本机。</div></div>';
  $('#qrCopy').onclick=()=>{const v=$('#qrLink');if(v){v.select();if(navigator.clipboard)navigator.clipboard.writeText(v.value).catch(()=>{});toast('已复制');}};
  $('#qrSave').onclick=()=>{
    const svgEl=$('#qrBig svg');if(!svgEl){toast('二维码未加载');return;}
    const s=new XMLSerializer().serializeToString(svgEl);
    const img=new Image();const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}));
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,512,512);x.drawImage(img,0,0,512,512);
      c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bolloon-connect.png';a.click();toast('已保存');});
      URL.revokeObjectURL(url);
    };
    img.onerror=()=>toast('保存失败');img.src=url;
  };
};

document.addEventListener('click',e=>{
  if(e.target.closest('#btnAddAgent')){openSub('addagent');return;}
  if(e.target.closest('#btnQr')){openSub('qr');return;}
  const del=e.target.closest('[data-del]');
  if(del){
    if(!confirm('删除这个会话？'))return;
    api.post('/api/sessions/delete',{id:del.dataset.del}).then(()=>{toast('已删除');return refreshBoot();}).catch(fail);
    return;
  }
});
let sx=0;
document.addEventListener('touchstart',e=>{const w=e.target.closest('.sess-wrap');if(w)sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const w=e.target.closest('.sess-wrap');if(!w)return;
  const dx=e.changedTouches[0].clientX-sx;
  if(dx<-60)w.classList.add('swiped');else if(dx>40)w.classList.remove('swiped');
},{passive:true});

/* ── 聊天队列 + 中断 ── */
const _sendMsgQ=sendMsg;
let CHAT_Q=Promise.resolve(),Q_LEN=0;
sendMsg=function(){
  Q_LEN++;
  CHAT_Q=CHAT_Q.then(async()=>{try{await _sendMsgQ();}finally{Q_LEN--;}});
  return CHAT_Q;
};
$('#btnSend').onclick=()=>sendMsg();
$('#btnStop').onclick=()=>api.post('/api/chat/stop',{session_id:S.sessionId}).then(()=>toast('已请求中断')).catch(fail);

/* ── 好友设置 / 昵称 ── */
SUBS.friend='好友设置';SUBS.profileedit='修改昵称';
let FRIEND_DID='';
const CAPS={
  general:['chat'],
  trust:['chat','share_judgment','invite_group','command_readonly'],
  full:['chat','share_judgment','invite_group','command_readonly','trust_write','trust_shell']
};
SUBLD.friend=async()=>{
  const d=await api.get('/api/friends/access?did='+encodeURIComponent(FRIEND_DID)).catch(()=>({}));
  const pinned=localStorage.getItem('bolloon.friend.pin.'+FRIEND_DID)==='1';
  $('#subBody').innerHTML='<div class="card"><div class="kv"><span class="k">DID</span><span class="v">'+esc(FRIEND_DID)+'</span></div>'+
    '<div class="kv"><span class="k">备注</span><span class="v">'+esc(d.name||'—')+'</span></div></div>'+
    '<div class="h">关系</div><div class="card col"><div class="btns">'+
    '<button class="btn '+(d.blocked?'danger':'')+'" data-fact="block">'+(d.blocked?'取消拉黑':'拉黑')+'</button>'+
    '<button class="btn" data-fact="pin">'+(pinned?'取消置顶':'置顶')+'</button></div></div>'+
    '<div class="h">权限</div><div class="card col">'+
    '<button class="btn" data-fact="perm" data-level="general">一般 · 只能读和交流</button>'+
    '<button class="btn" data-fact="perm" data-level="trust">信任 · 项目内可写</button>'+
    '<button class="btn" data-fact="perm" data-level="full">完全信任 · 除钱包外可读写</button>'+
    '<div class="small muted" style="line-height:1.55">写入当前智能体对该好友的 caps；钱包相关 payment_info 不在任何档位内。</div></div>';
  $('#subBody').onclick=async e=>{
    const b=e.target.closest('[data-fact]');if(!b)return;
    try{
      if(b.dataset.fact==='block'){
        await api.post('/api/friends/block',{did:FRIEND_DID,on:!d.blocked});
        toast(d.blocked?'已取消拉黑':'已拉黑');SUBLD.friend();
      }else if(b.dataset.fact==='pin'){
        const k='bolloon.friend.pin.'+FRIEND_DID;
        localStorage.setItem(k,pinned?'0':'1');toast(pinned?'已取消置顶':'已置顶');SUBLD.friend();
      }else if(b.dataset.fact==='perm'){
        const a=activeAgent();if(!a){toast('没有智能体');return;}
        const caps=CAPS[b.dataset.level]||CAPS.general;
        await api.post('/api/agents/'+encodeURIComponent(a.id)+'/grants',{did:FRIEND_DID,caps});
        toast('已授予：'+b.dataset.level);
      }
    }catch(err){fail(err);}
  };
};
SUBLD.profileedit=async()=>{
  const name=(S.boot&&S.boot.state&&S.boot.state.profile&&S.boot.state.profile.name)||'';
  $('#subBody').innerHTML='<div class="card col"><div class="field"><label>昵称</label><input id="peName" value="'+esc(name)+'" maxlength="24"></div><button class="btn primary" id="peSave">保存</button></div>';
  $('#peSave').onclick=()=>{const v=($('#peName').value||'').trim();if(!v){toast('昵称不能为空');return;}api.post('/api/profile',{name:v}).then(()=>{toast('已保存');return refreshBoot();}).catch(fail);};
};

const _loadContacts=loadContacts;
loadContacts=async function(){
  await _loadContacts();
  const list=$('#contactList');
  if(list){
    list.querySelectorAll('[data-contact]').forEach(b=>{
      const did=b.dataset.contact||'';
      if(did&&!b.querySelector('[data-friend]'))b.insertAdjacentHTML('beforeend','<span class="badge" data-friend="'+esc(did)+'" title="好友设置">⚙</span>');
    });
    let box=$('#contactGroups');
    if(!box){box=document.createElement('div');box.id='contactGroups';list.parentNode.appendChild(box);}
    try{
      const g=await api.get('/api/groups');const gs=g.groups||[];
      box.innerHTML='<div class="h">本机群组 '+gs.length+'</div><div class="list">'+(gs.length?gs.map(x=>'<div class="item"><span class="av">G</span><span class="grow"><span class="t">'+esc(x.name||x.id)+'</span><span class="d">'+(x.pinned?'已置顶 · ':'')+esc(x.id)+'</span></span></div>').join(''):'<div class="empty">还没有群组</div>')+'</div>'+
        '<div class="small muted">外部联系人智能体开放的群组需先从好友设置授予 chat 权限后读取。</div>';
    }catch(_){box.innerHTML='<div class="h">本机群组</div><div class="empty">加载失败</div>';}
  }
};

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-friend]');
  if(f){e.stopPropagation();FRIEND_DID=f.dataset.friend||'';if(FRIEND_DID)openSub('friend');return;}
  if(e.target.closest('#meName')){openSub('profileedit');}
});

applyTheme(themePref());
refreshQr().then(()=>renderMe());
qrTimer=setInterval(()=>{if(!qrFrozen())refreshQr();},15000);
/* iOS 全屏 WebView 的 innerHeight 可能大于屏幕；限制 app 高度，避免底部出现黑区 */
$('#drawer').classList.remove('on');
$('#sub').classList.remove('on');
refreshBoot().then(()=>{showTab('home');}).catch(e=>{toast('后端未就绪：'+((e&&e.message)||e),4000);console.error(e);});
})();
</script>
