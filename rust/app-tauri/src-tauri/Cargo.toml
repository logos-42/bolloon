[lib]
name = "bolloon_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package]
name = "bolloon-tauri"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
description = "Bolloon 桌面外壳 (Tauri) — 托管内嵌服务, 壳不写业务"

# 独立于 workspace (tauri 依赖树大, 不拖垮主构建)
[workspace]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

# 内嵌业务服务 (核心 crate 直连, 不 spawn 子进程)
bolloon-web = { path = "../../crates/bolloon-web" }
bolloon-llm = { path = "../../crates/bolloon-llm" }
bolloon-agent = { path = "../../crates/bolloon-agent" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 体积优化: Windows 便携 exe / Android .so 都要塞进 25 MiB 的分发上限
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
